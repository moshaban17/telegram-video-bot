          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}
        run: |
          if [ "$WATERMARK_ENABLED" = "true" ] && [ -n "$WATERMARK_MESSAGE_DATE" ]; then

            echo "🖼️ Downloading watermark..."

            cat > download_watermark.py <<'PY'
import os
import asyncio
from datetime import datetime, timezone
from telethon import TelegramClient
from telethon.sessions import StringSession

async def main():
