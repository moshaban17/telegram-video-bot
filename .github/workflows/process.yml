      - name: Send OCR SRT to Telegram
        if: ${{ inputs.operation == 'video_ocr' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@screen_text.srt" \
            -F "caption=👁️ تم استخراج الكلام الظاهر على الشاشة إلى SRT."


      # ============================================================
      # VIDEO PROCESSING
      # ============================================================

      - name: Install FFmpeg fonts
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          sudo apt-get install -y fonts-noto-core


      - name: Download subtitle
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          if [ -z "${{ inputs.subtitle_url }}" ]; then

            echo "❌ subtitle_url is empty."

            exit 1

          fi


          aria2c \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=1M \
            --file-allocation=none \
            -o subtitle.srt \
            "${{ inputs.subtitle_url }}"


      - name: Set resolution
        if: ${{ inputs.operation == 'video' && inputs.resolution != 'same' }}
        run: |

          case "${{ inputs.resolution }}" in

            "1080p")
              echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV"
              ;;

            "720p")
              echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV"
              ;;

            "480p")
              echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV"
              ;;

            "360p")
              echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV"
              ;;

          esac


      # ============================================================
      # BURN SUBTITLE
      # ============================================================

      - name: Process video with subtitle
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          if [ "${SCALE_FILTER:-}" = "" ]; then

            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2'"

          else

            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2',${SCALE_FILTER}"

          fi


          ffmpeg -y \
            -i input.mkv \
            -vf "$VIDEO_FILTER" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4


      # ============================================================
      # RESOLUTION CONVERSION
      # ============================================================

      - name: Convert resolution
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url == '' && inputs.resolution != 'same' }}
        run: |

          ffmpeg -y \
            -i input.mkv \
            -vf "${SCALE_FILTER}" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4


      # ============================================================
      # SAME RESOLUTION
      # ============================================================

      - name: Remux original video to MP4
        if: ${{ inputs.operation == 'video' && inputs.resolution == 'same' && inputs.subtitle_url == '' }}
        run: |

          echo "🎬 Keeping original resolution and quality."

          ffmpeg -y \
            -i input.mkv \
            -map 0:v:0 \
            -map 0:a? \
            -c copy \
            -movflags +faststart \
            output.mp4


      # ============================================================
      # SELECT OUTPUT
      # ============================================================

      - name: Select output
        if: ${{ inputs.operation == 'video' }}
        run: |

          if [ -f output.mp4 ]; then

            echo "OUTPUT_FILE=output.mp4" >> "$GITHUB_ENV"

          else

            echo "❌ output.mp4 was not created."

            exit 1

          fi


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check final video
        if: ${{ inputs.operation == 'video' }}
        run: |

          if [ ! -f "${OUTPUT_FILE}" ]; then

            echo "❌ Output file not found."

            exit 1

          fi


          echo "========================================"

          echo "🎬 Final output:"
          echo "${OUTPUT_FILE}"

          echo "📦 Size:"

          du -h "${OUTPUT_FILE}"

          echo "========================================"


          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,codec_type \
            -of default=noprint_wrappers=1 \
            "${OUTPUT_FILE}"


      # ============================================================
      # SEND VIDEO
      # ============================================================

      - name: Send video result to Telegram
        if: ${{ inputs.operation == 'video' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |

          cat > send.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(
                      os.environ["API_ID"]
                  ),
                  os.environ["API_HASH"]
              )


              await client.start()


              output_file = os.environ[
                  "OUTPUT_FILE"
              ]


              if not os.path.exists(
                  output_file
              ):

                  raise RuntimeError(
                      "Output video does not exist."
                  )


              size_mb = (
                  os.path.getsize(
                      output_file
                  )
                  / 1024
                  / 1024
              )


              print(
                  "📤 Starting Telegram upload..."
              )

              print(
                  f"📦 File size: "
                  f"{size_mb:.2f} MB"
              )


              await client.send_file(
                  int(
                      os.environ["CHAT_ID"]
                  ),
                  output_file,
                  caption="🎬 تم تجهيز الفيلم بنجاح.",
                  video=True,
                  supports_streaming=True
              )


              print(
                  "✅ Telegram upload completed."
              )


              await client.disconnect()


          asyncio.run(main())
          PY


          python send.py


