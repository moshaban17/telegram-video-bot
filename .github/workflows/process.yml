name: Video Processor

on:
  workflow_dispatch:
    inputs:

      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

      video_message_id:
        description: "Telegram Video Message ID"
        required: true
        type: string

      subtitle_message_id:
        description: "Telegram Subtitle Message ID"
        required: true
        type: string

      subtitle_type:
        description: "Subtitle Type"
        required: true
        type: choice
        options:
          - srt
          - ass
          - ssa
        default: srt

      font_message_id:
        description: "Telegram Font Message ID"
        required: false
        type: string
        default: ""

      font_size:
        description: "Subtitle Font Size"
        required: false
        type: string
        default: "26"

      font_color:
        description: "Subtitle Color"
        required: false
        type: string
        default: "white"

      subtitle_outline:
        description: "Subtitle Outline"
        required: false
        type: string
        default: "0.5"

      subtitle_box:
        description: "Subtitle Box"
        required: false
        type: string
        default: "off"

      watermark_message_id:
        description: "Watermark Message ID"
        required: false
        type: string
        default: ""

      watermark_enabled:
        description: "Watermark Enabled"
        required: false
        type: string
        default: "false"

      watermark_position:
        description: "Watermark Position"
        required: false
        type: string
        default: "top_left"

      watermark_size:
        description: "Watermark Size"
        required: false
        type: string
        default: "20"


jobs:

  burn:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-extra \
            unrar \
            file

          python -m pip install --upgrade pip

          pip install \
            "telethon>=1.45,<2" \
            cryptg


      - name: Validate secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -e

          test -n "$API_ID" || {
            echo "API_ID is missing"
            exit 1
          }

          test -n "$API_HASH" || {
            echo "API_HASH is missing"
            exit 1
          }

          test -n "$BOT_TOKEN" || {
            echo "BOT_TOKEN is missing"
            exit 1
          }


      - name: Download Telegram files
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

          CHAT_ID: ${{ inputs.chat_id }}

          VIDEO_MESSAGE_ID: ${{ inputs.video_message_id }}

          SUBTITLE_MESSAGE_ID: ${{ inputs.subtitle_message_id }}

          FONT_MESSAGE_ID: ${{ inputs.font_message_id }}

          WATERMARK_MESSAGE_ID: ${{ inputs.watermark_message_id }}

        run: |

          cat > download_media.py <<'PY'

          import os
          import asyncio

          from telethon import TelegramClient


          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          BOT_TOKEN = os.environ["BOT_TOKEN"]

          CHAT_ID = int(os.environ["CHAT_ID"])


          async def download_message(
              client,
              message_id,
              filename
          ):
              if not message_id:
                  return False

              message = await client.get_messages(
                  CHAT_ID,
                  ids=int(message_id)
              )

              if not message:
                  raise RuntimeError(
                      f"لم يتم العثور على الرسالة {message_id}"
                  )

              if not message.media:
                  raise RuntimeError(
                      f"الرسالة {message_id} لا تحتوي على ملف."
                  )

              result = await client.download_media(
                  message,
                  file=filename
              )

              if not result:
                  raise RuntimeError(
                      f"فشل تحميل الرسالة {message_id}"
                  )

              print(
                  f"Downloaded {message_id}: {result}"
              )

              return True


          async def main():

              client = TelegramClient(
                  "github_session",
                  API_ID,
                  API_HASH
              )

              await client.start(
                  bot_token=BOT_TOKEN
              )

              await download_message(
                  client,
                  os.environ["VIDEO_MESSAGE_ID"],
                  "input_video"
              )

              await download_message(
                  client,
                  os.environ["SUBTITLE_MESSAGE_ID"],
                  "subtitle_source"
              )

              await download_message(
                  client,
                  os.environ.get(
                      "FONT_MESSAGE_ID",
                      ""
                  ),
                  "font_source"
              )

              await download_message(
                  client,
                  os.environ.get(
                      "WATERMARK_MESSAGE_ID",
                      ""
                  ),
                  "watermark_source"
              )

              await client.disconnect()


          asyncio.run(main())

          PY

          python download_media.py


      - name: Prepare subtitle and font
        env:
          SUBTITLE_TYPE: ${{ inputs.subtitle_type }}

        run: |

          set -e

          mkdir -p fonts


          case "$SUBTITLE_TYPE" in

            srt)
              cp subtitle_source subtitle.srt
              ;;

            ass)
              cp subtitle_source subtitle.ass
              ;;

            ssa)
              cp subtitle_source subtitle.ssa
              ;;

            *)
              echo "نوع الترجمة غير صحيح"
              exit 1
              ;;

          esac


          if [ -f font_source ]; then

            if file font_source | grep -qi "RAR archive"; then

              mkdir -p font_extract

              unrar x \
                -o+ \
                -inul \
                font_source \
                font_extract/

              find font_extract \
                -type f \
                \( \
                  -iname "*.ttf" \
                  -o \
                  -iname "*.otf" \
                \) \
                -exec cp {} fonts/ \;

            else

              if file font_source | grep -qiE \
                "TrueType|OpenType"; then

                cp font_source fonts/custom_font

              else

                echo "ملف الخط ليس TTF أو OTF أو RAR."

                exit 1

              fi

            fi

          fi


          if find fonts \
            -maxdepth 1 \
            -type f \
            \( \
              -iname "*.ttf" \
              -o \
              -iname "*.otf" \
            \) \
            | grep -q .; then

            mkdir -p \
              "$HOME/.local/share/fonts"

            find fonts \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.ttf" \
                -o \
                -iname "*.otf" \
              \) \
              -exec cp {} \
              "$HOME/.local/share/fonts/" \;

            fc-cache -f

          fi


      - name: Prepare watermark
        env:
          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}

        run: |

          set -e

          if [ "$WATERMARK_ENABLED" != "true" ]; then
            echo "Watermark disabled."
            exit 0
          fi

          if [ ! -f watermark_source ]; then
            echo "No watermark file."
            exit 0
          fi


          if file watermark_source | \
            grep -qi "RAR archive"; then

            mkdir -p watermark_extract

            unrar x \
              -o+ \
              -inul \
              watermark_source \
              watermark_extract/

            IMAGE_FILE="$(
              find watermark_extract \
                -type f \
                \( \
                  -iname "*.png" \
                  -o \
                  -iname "*.jpg" \
                  -o \
                  -iname "*.jpeg" \
                  -o \
                  -iname "*.webp" \
                \) \
                | head -n 1
            )"

            if [ -z "$IMAGE_FILE" ]; then
              echo "لم يتم العثور على صورة داخل RAR."
              exit 1
            fi

            cp "$IMAGE_FILE" watermark.png

          else

            cp watermark_source watermark.png

          fi


          test -s watermark.png


      - name: Detect video information
        run: |

          set -e

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            input_video \
            > duration.txt

          DURATION="$(cat duration.txt)"

          echo "Video duration: $DURATION"


      - name: Process video
        env:
          SUBTITLE_TYPE: ${{ inputs.subtitle_type }}

          FONT_SIZE: ${{ inputs.font_size }}

          FONT_COLOR: ${{ inputs.font_color }}

          SUBTITLE_OUTLINE: ${{ inputs.subtitle_outline }}

          SUBTITLE_BOX: ${{ inputs.subtitle_box }}

          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}

          WATERMARK_POSITION: ${{ inputs.watermark_position }}

          WATERMARK_SIZE: ${{ inputs.watermark_size }}

        run: |

          set -e


          case "$FONT_COLOR" in

            white)
              PRIMARY="&H00FFFFFF"
              ;;

            yellow)
              PRIMARY="&H0000FFFF"
              ;;

            cyan)
              PRIMARY="&H00FFFF00"
              ;;

            green)
              PRIMARY="&H0000FF00"
              ;;

            red)
              PRIMARY="&H000000FF"
              ;;

            blue)
              PRIMARY="&H00FF0000"
              ;;

            *)
              PRIMARY="&H00FFFFFF"
              ;;

          esac


          BORDER_STYLE=1

          if [ "$SUBTITLE_BOX" = "on" ]; then
            BORDER_STYLE=3
          fi


          FONT_NAME="Noto Sans Arabic"


          CUSTOM_FONT="$(
            find fonts \
              -maxdepth 1 \
              -type f \
              \( \
                -iname "*.ttf" \
                -o \
                -iname "*.otf" \
              \) \
              | head -n 1
          )"


          if [ -n "$CUSTOM_FONT" ]; then

            DETECTED_FONT="$(
              fc-scan \
                --format='%{family}\n' \
                "$CUSTOM_FONT" \
                2>/dev/null \
                | head -n 1
            )"

            if [ -n "$DETECTED_FONT" ]; then
              FONT_NAME="$DETECTED_FONT"
            fi

          fi


          if [ "$SUBTITLE_TYPE" = "srt" ]; then

            FORCE_STYLE="FontName=$FONT_NAME,FontSize=$FONT_SIZE,PrimaryColour=$PRIMARY,OutlineColour=&H00000000,BorderStyle=$BORDER_STYLE,Outline=$SUBTITLE_OUTLINE,Shadow=0,Alignment=2,MarginV=28"

            SUB_FILTER="subtitles=subtitle.srt:fontsdir=fonts:force_style='$FORCE_STYLE'"

          elif [ "$SUBTITLE_TYPE" = "ass" ]; then

            SUB_FILTER="ass=subtitle.ass:fontsdir=fonts"

          elif [ "$SUBTITLE_TYPE" = "ssa" ]; then

            SUB_FILTER="ass=subtitle.ssa:fontsdir=fonts"

          else

            echo "Unsupported subtitle type."

            exit 1

          fi


          if [ "$WATERMARK_ENABLED" = "true" ] \
            && [ -f watermark.png ]; then

            SIZE="${WATERMARK_SIZE:-20}"


            case "$WATERMARK_POSITION" in

              top_right)
                OX="main_w-overlay_w-20"
                OY="20"
                ;;

              bottom_left)
                OX="20"
                OY="main_h-overlay_h-20"
                ;;

              bottom_right)
                OX="main_w-overlay_w-20"
                OY="main_h-overlay_h-20"
                ;;

              *)
                OX="20"
                OY="20"
                ;;

            esac


            FILTER="[0:v]$SUB_FILTER[subbed];[1:v]scale2ref=w=main_w*${SIZE}/100:h=-1[wm][ref];[subbed][wm]overlay=${OX}:${OY}:format=auto[vout]"


            ffmpeg \
              -hide_banner \
              -y \
              -i input_video \
              -loop 1 \
              -i watermark.png \
              -filter_complex "$FILTER" \
              -map "[vout]" \
              -map 0:a? \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              -shortest \
              output.mp4

          else

            FILTER="[0:v]$SUB_FILTER[vout]"


            ffmpeg \
              -hide_banner \
              -y \
              -i input_video \
              -filter_complex "$FILTER" \
              -map "[vout]" \
              -map 0:a? \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              output.mp4

          fi


          test -s output.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output.mp4

          ls -lh output.mp4


      - name: Send video to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}

        run: |

          cat > send_video.py <<'PY'

          import os
          import asyncio

          from telethon import TelegramClient


          async def main():

              client = TelegramClient(
                  "github_send_session",
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start(
                  bot_token=os.environ["BOT_TOKEN"]
              )


              await client.send_file(
                  int(os.environ["CHAT_ID"]),
                  "output.mp4",
                  caption="🎬 تم حرق الترجمة بنجاح.",
                  supports_streaming=True
              )


              await client.disconnect()


          asyncio.run(main())

          PY


          python send_video.py


      - name: Cleanup
        if: always()

        run: |

          rm -rf \
            github_session* \
            github_send_session*

          rm -rf \
            input_video \
            subtitle_source \
            font_source \
            watermark_source

          rm -rf \
            subtitle.srt \
            subtitle.ass \
            subtitle.ssa

          rm -rf \
            fonts \
            font_extract \
            watermark_extract

          rm -f \
            watermark.png \
            output.mp4 \
            duration.txt \
            download_media.py \
            send_video.py
