name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: false
        type: string
        default: ""

      subtitle_url:
        description: "Direct SRT URL"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "same"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      bot_username:
        description: "Telegram bot username"
        required: false
        type: string
        default: "CinmalekHardsubBot"

      srt_file_id:
        description: "Telegram SRT file ID"
        required: false
        type: string
        default: ""

      telegram_message_id:
        description: "Telegram media message ID"
        required: false
        type: string
        default: ""

      source_type:
        description: "Video source"
        required: false
        type: choice
        options:
          - "url"
          - "telegram"
        default: "url"

      operation:
        description: "Operation"
        required: false
        type: choice
        options:
          - "video"
          - "translate_srt"
          - "video_ocr"
          - "audio_srt"
        default: "video"


jobs:

  process:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SRT TRANSLATION
      # ============================================================

      - name: Install Python packages for SRT translation
        if: ${{ inputs.operation == 'translate_srt' }}
        run: |
          python -m pip install --upgrade pip
          pip install -U google-genai requests

      - name: Download SRT from Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SRT_FILE_ID: ${{ inputs.srt_file_id }}
        run: |

          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          file_id = os.environ["SRT_FILE_ID"]

          if not file_id:
              raise RuntimeError("SRT_FILE_ID is empty.")

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getFile",
              params={"file_id": file_id},
              timeout=30
          )

          r.raise_for_status()

          data = r.json()

          if not data.get("ok"):
              raise RuntimeError(data)

          file_path = data["result"]["file_path"]

          download_url = (
              f"https://api.telegram.org/file/bot"
              f"{token}/{file_path}"
          )

          r = requests.get(
              download_url,
              timeout=120
          )

          r.raise_for_status()

          with open("input.srt", "wb") as f:
              f.write(r.content)

          print("SRT downloaded successfully.")
          PY


      - name: Translate SRT with Gemini
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          cat > translate_srt.py <<'PY'
          import os
          import re
          import time

          from google import genai
          from google.genai import errors


          INPUT_FILE = "input.srt"
          OUTPUT_FILE = "arabic.srt"

          PRIMARY_MODEL = "gemini-3.8-flash"
          FALLBACK_MODEL = "gemini-3.7-flash"

          BATCH_SIZE = 80

          MAX_RETRIES_PER_MODEL = 5


          PROMPT = r"""
          أنت مترجم محترف لترجمة الأفلام والمسلسلات إلى العربية الفصحى.

          ترجم الحوار إلى عربية فصحى طبيعية وسينمائية.

          القواعد:

          1. افهم السياق قبل الترجمة.
          2. لا تترجم التعبيرات الاصطلاحية حرفيًا إذا أدى ذلك إلى معنى غير طبيعي.
          3. راعِ جنس المتحدث والمخاطَب.
          4. حافظ على أسماء الشخصيات والمصطلحات.
          5. حافظ على مستوى الشتائم والإهانات في الأصل.
          6. لا تحذف أو تضف حوارًا.
          7. لا تغير أرقام المقاطع.
          8. لا تغير التوقيتات.
          9. لا تغير ترتيب المقاطع.
          10. حافظ على جميع HTML tags كما هي.
          11. حافظ على رموز ♪ و ♫ كما هي.
          12. استخدم العربية الفصحى وليس العامية.
          13. استخدم "إله" حسب السياق بدل استبداله تلقائيًا بـ"الله".
          14. Hey man = يا رجل.
          15. Hey + name = يا [الاسم].
          16. Wow = يا للروعة.
          17. لا تضف شرحًا أو ملاحظات.
          18. أعد SRT فقط.

          غيّر نص الحوار فقط.
          """


          def parse_srt(text):

              text = text.replace("\r\n", "\n")
              text = text.replace("\r", "\n")

              blocks = re.split(
                  r"\n\s*\n",
                  text.strip()
              )

              result = []

              for block in blocks:

                  lines = block.split("\n")

                  if len(lines) < 3:
                      continue

                  result.append({
                      "number": lines[0],
                      "timing": lines[1],
                      "text": "\n".join(lines[2:])
                  })

              return result


          def build_srt(blocks):

              output = []

              for block in blocks:

                  output.append(block["number"])
                  output.append(block["timing"])
                  output.append(block["text"])
                  output.append("")

              return "\n".join(output)


          def extract_answer(text):

              text = text.strip()

              if text.startswith("```"):

                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if (
                      lines
                      and lines[-1].strip() == "```"
                  ):
                      lines = lines[:-1]

                  text = "\n".join(lines)

              return text.strip()


          def is_retryable_error(exc):

              code = getattr(
                  exc,
                  "code",
                  None
              )

              status_code = getattr(
                  exc,
                  "status_code",
                  None
              )

              if code in (
                  408,
                  429,
                  500,
                  502,
                  503,
                  504
              ):
                  return True

              if status_code in (
                  408,
                  429,
                  500,
                  502,
                  503,
                  504
              ):
                  return True

              text = str(exc).upper()

              for marker in (
                  "503",
                  "429",
                  "500",
                  "502",
                  "504",
                  "UNAVAILABLE",
                  "RESOURCE_EXHAUSTED",
                  "INTERNAL",
                  "TIMEOUT"
              ):

                  if marker in text:
                      return True

              return False


          def call_gemini(
              client,
              model,
              prompt
          ):

              last_error = None

              for attempt in range(
                  1,
                  MAX_RETRIES_PER_MODEL + 1
              ):

                  try:

                      print(
                          f"🤖 Model: {model} | "
                          f"Attempt {attempt}/"
                          f"{MAX_RETRIES_PER_MODEL}"
                      )

                      response = (
                          client.models.generate_content(
                              model=model,
                              contents=prompt
                          )
                      )

                      if not response.text:

                          raise RuntimeError(
                              "Gemini returned an empty response."
                          )

                      return response.text

                  except Exception as exc:

                      last_error = exc

                      print(
                          f"⚠️ Gemini error: {exc}"
                      )

                      if not is_retryable_error(
                          exc
                      ):

                          raise

                      if attempt >= MAX_RETRIES_PER_MODEL:
                          break

                      wait_seconds = min(
                          60,
                          5 * (2 ** (attempt - 1))
                      )

                      print(
                          f"⏳ Waiting "
                          f"{wait_seconds} seconds "
                          f"before retry..."
                      )

                      time.sleep(
                          wait_seconds
                      )

              raise last_error


          def validate_translation(
              original,
              translated
          ):

              if len(translated) != len(original):

                  raise RuntimeError(
                      f"Expected {len(original)} "
                      f"subtitles but received "
                      f"{len(translated)}"
                  )

              for old, new in zip(
                  original,
                  translated
              ):

                  if old["number"] != new["number"]:

                      raise RuntimeError(
                          "Subtitle numbering changed."
                      )

                  if old["timing"] != new["timing"]:

                      raise RuntimeError(
                          "Subtitle timing changed."
                      )


          def translate_batch(
              client,
              batch
          ):

              source = build_srt(batch)

              prompt = (
                  PROMPT
                  + "\n\nهذه المقاطع:\n\n"
                  + source
              )

              print(
                  "🚀 Sending batch to Gemini..."
              )

              # ------------------------------------------------
              # First try the primary model.
              # ------------------------------------------------

              try:

                  response_text = call_gemini(
                      client,
                      PRIMARY_MODEL,
                      prompt
                  )

                  translated = parse_srt(
                      extract_answer(
                          response_text
                      )
                  )

                  validate_translation(
                      batch,
                      translated
                  )

                  print(
                      f"✅ Batch translated with "
                      f"{PRIMARY_MODEL}"
                  )

                  return translated

              except Exception as primary_error:

                  print(
                      "⚠️ Primary model failed:"
                  )

                  print(
                      primary_error
                  )

                  print(
                      f"🔄 Switching to "
                      f"{FALLBACK_MODEL}..."
                  )


              # ------------------------------------------------
              # Fallback model.
              # ------------------------------------------------

              response_text = call_gemini(
                  client,
                  FALLBACK_MODEL,
                  prompt
              )

              translated = parse_srt(
                  extract_answer(
                      response_text
                  )
              )

              validate_translation(
                  batch,
                  translated
              )

              print(
                  f"✅ Batch translated with "
                  f"{FALLBACK_MODEL}"
              )

              return translated


          # ====================================================
          # READ INPUT
          # ====================================================

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig"
          ) as f:

              text = f.read()


          subtitles = parse_srt(text)


          if not subtitles:

              raise RuntimeError(
                  "No valid subtitles found."
              )


          print(
              f"📄 Total subtitles: "
              f"{len(subtitles)}"
          )


          client = genai.Client(
              api_key=os.environ[
                  "GEMINI_API_KEY"
              ]
          )


          translated_all = []


          # ====================================================
          # TRANSLATE
          # ====================================================

          for start in range(
              0,
              len(subtitles),
              BATCH_SIZE
          ):

              end = min(
                  start + BATCH_SIZE,
                  len(subtitles)
              )


              print("")
              print(
                  "========================================"
              )

              print(
                  f"🌐 Translating subtitles "
                  f"{start + 1}-{end} "
                  f"of {len(subtitles)}"
              )

              print(
                  "========================================"
              )


              batch = subtitles[
                  start:end
              ]


              translated_batch = (
                  translate_batch(
                      client,
                      batch
                  )
              )


              translated_all.extend(
                  translated_batch
              )


              # Save progress after EVERY batch.
              # If a later batch fails, all previous
              # successful batches are already written.
              with open(
                  OUTPUT_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      build_srt(
                          translated_all
                      )
                  )


              print(
                  f"💾 Saved progress: "
                  f"{len(translated_all)} "
                  f"subtitles"
              )


              if end < len(subtitles):

                  time.sleep(2)


          # ====================================================
          # FINAL VALIDATION
          # ====================================================

          if len(translated_all) != len(subtitles):

              raise RuntimeError(
                  "Final subtitle count does not match "
                  "the original subtitle count."
              )


          for original, translated in zip(
              subtitles,
              translated_all
          ):

              if (
                  original["number"]
                  != translated["number"]
              ):

                  raise RuntimeError(
                      "Final subtitle numbering changed."
                  )

              if (
                  original["timing"]
                  != translated["timing"]
              ):

                  raise RuntimeError(
                      "Final subtitle timing changed."
                  )


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  build_srt(
                      translated_all
                  )
              )


          print("")
          print(
              "========================================"
          )

          print(
              f"✅ Translation completed: "
              f"{len(translated_all)} subtitles"
          )

          print(
              f"📄 Output: {OUTPUT_FILE}"
          )

          print(
              "========================================"
          )
          PY

          python translate_srt.py


      - name: Send translated SRT to Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@arabic.srt" \
            -F "caption=🇸🇦 تمت ترجمة ملف SRT إلى العربية الفصحى بنجاح."


      # ============================================================
      # TELEGRAM / VIDEO TOOLS
      # ============================================================

      - name: Install Telegram library
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt' }}
        run: |
          python -m pip install "telethon<2" cryptg


      - name: Install audio transcription tools
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2

          python -m pip install --upgrade pip

          pip install faster-whisper


      - name: Install video tools
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' }}
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2


      # ============================================================
      # TELEGRAM MEDIA INPUT
      # ============================================================

      - name: Download media from Telegram
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt') && inputs.source_type == 'telegram' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: ${{ inputs.bot_username }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          OPERATION: ${{ inputs.operation }}
        run: |

          cat > download_telegram.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          VIDEO_EXTENSIONS = (
              ".mp4",
              ".mkv",
              ".avi",
              ".mov",
              ".webm",
              ".m4v",
              ".ts"
          )

          AUDIO_EXTENSIONS = (
              ".mp3",
              ".wav",
              ".m4a",
              ".aac",
              ".ogg",
              ".opus",
              ".flac",
              ".amr",
              ".wma"
          )


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )


              await client.start()


              user_id = int(
                  os.environ["CHAT_ID"]
              )


              me = await client.get_me()


              if me.id != user_id:

                  raise RuntimeError(
                      "Telegram session account does not match CHAT_ID."
                  )


              bot_username = (
                  os.environ["BOT_USERNAME"]
                  .strip()
                  .lstrip("@")
              )


              operation = os.environ[
                  "OPERATION"
              ]


              message_id = (
                  os.environ.get(
                      "TELEGRAM_MESSAGE_ID",
                      ""
                  ).strip()
              )


              entity = await client.get_entity(
                  f"@{bot_username}"
              )


              found = None


              # ------------------------------------------------
              # Exact message first
              # ------------------------------------------------

              if message_id:

                  print(
                      f"🔎 Searching exact message "
                      f"{message_id}..."
                  )

                  try:

                      item = await client.get_messages(
                          entity,
                          ids=int(message_id)
                      )

                  except Exception as e:

                      raise RuntimeError(
                          f"Cannot read Telegram message: {e}"
                      )


                  if item:

                      if item.media and item.file:

                          mime = (
                              getattr(
                                  item.file,
                                  "mime_type",
                                  ""
                              )
                              or ""
                          )


                          name = (
                              getattr(
                                  item.file,
                                  "name",
                                  ""
                              )
                              or ""
                          ).lower()


                          is_video = (
                              mime.startswith("video/")
                              or name.endswith(
                                  VIDEO_EXTENSIONS
                              )
                          )


                          is_audio = (
                              mime.startswith("audio/")
                              or name.endswith(
                                  AUDIO_EXTENSIONS
                              )
                          )


                          if operation == "audio_srt":

                              if (
                                  is_video
                                  or is_audio
                              ):

                                  found = item

                          else:

                              if is_video:

                                  found = item


              # ------------------------------------------------
              # Fallback
              # ------------------------------------------------

              if not found:

                  print(
                      "🔎 Searching last 200 messages..."
                  )


                  async for item in client.iter_messages(
                      entity,
                      limit=200,
                      from_user=user_id
                  ):

                      if not item.media:
                          continue

                      if not item.file:
                          continue


                      mime = (
                          getattr(
                              item.file,
                              "mime_type",
                              ""
                          )
                          or ""
                      )


                      name = (
                          getattr(
                              item.file,
                              "name",
                              ""
                          )
                          or ""
                      ).lower()


                      is_video = (
                          mime.startswith("video/")
                          or name.endswith(
                              VIDEO_EXTENSIONS
                          )
                      )


                      is_audio = (
                          mime.startswith("audio/")
                          or name.endswith(
                              AUDIO_EXTENSIONS
                          )
                      )


                      if operation == "audio_srt":

                          if not (
                              is_video
                              or is_audio
                          ):

                              continue

                      else:

                          if not is_video:
                              continue


                      found = item

                      break


              if not found:

                  raise RuntimeError(
                      "No suitable Telegram media found."
                  )


              print(
                  f"✅ Found Telegram message "
                  f"{found.id}"
              )


              path = await found.download_media(
                  file="input.mkv"
              )


              if not path:

                  raise RuntimeError(
                      "Telegram download failed."
                  )


              print(
                  f"✅ Downloaded: {path}"
              )


              print(
                  f"📦 Size: "
                  f"{os.path.getsize(path) / 1024 / 1024:.2f} MB"
              )


              await client.disconnect()


          asyncio.run(main())
          PY


          python download_telegram.py


      # ============================================================
      # URL DOWNLOAD
      # ============================================================

      - name: Download video from URL
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'video_ocr') && inputs.source_type == 'url' }}
        run: |

          if [ -z "${{ inputs.video_url }}" ]; then

            echo "❌ video_url is empty."

            exit 1

          fi


          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --continue=true \
            --summary-interval=5 \
            --console-log-level=notice \
            -o input.mkv \
            "${{ inputs.video_url }}"


      - name: Download media from URL for speech to SRT
        if: ${{ inputs.operation == 'audio_srt' && inputs.source_type == 'url' }}
        run: |

          if [ -z "${{ inputs.video_url }}" ]; then

            echo "❌ video_url is empty."

            exit 1

          fi


          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --continue=true \
            --summary-interval=5 \
            --console-log-level=notice \
            -o input.mkv \
            "${{ inputs.video_url }}"


      # ============================================================
      # SPEECH TO SRT
      # ============================================================

      - name: Extract audio for speech recognition
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          ffmpeg -y \
            -i input.mkv \
            -vn \
            -ac 1 \
            -ar 16000 \
            -c:a pcm_s16le \
            speech.wav


      - name: Convert speech to SRT
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          cat > speech_to_srt.py <<'PY'
          import re

          from faster_whisper import WhisperModel


          INPUT_FILE = "speech.wav"
          OUTPUT_FILE = "speech.srt"

          MODEL_NAME = "medium"


          def format_time(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              minutes = (
                  total_ms % 3600000
              ) // 60000

              secs = (
                  total_ms % 60000
              ) // 1000

              milliseconds = (
                  total_ms % 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{milliseconds:03d}"
              )


          def clean_text(text):

              text = text.strip()

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text


          def normalize_text(text):

              return clean_text(
                  text
              ).lower()


          print("========================================")
          print("🎙️ SPEECH TO SRT")
          print("========================================")
          print("🧠 Loading Whisper model...")
          print(f"📦 Model: {MODEL_NAME}")
          print("⚙️ Device: CPU")
          print("⚙️ Compute type: int8")


          model = WhisperModel(
              MODEL_NAME,
              device="cpu",
              compute_type="int8",
              cpu_threads=4,
              num_workers=1
          )


          print("✅ Whisper model loaded.")
          print("🎧 Transcribing speech...")
          print("🔇 VAD enabled.")


          segments, info = model.transcribe(

              INPUT_FILE,

              beam_size=3,

              temperature=0,

              vad_filter=True,

              vad_parameters={
                  "min_silence_duration_ms": 500,
                  "speech_pad_ms": 400,
                  "min_speech_duration_ms": 150
              },

              condition_on_previous_text=False,

              no_speech_threshold=0.92,

              log_prob_threshold=-2.5,

              compression_ratio_threshold=3.5
          )


          print(
              f"🌐 Detected language: "
              f"{getattr(info, 'language', 'unknown')}"
          )


          print(
              f"📊 Language probability: "
              f"{getattr(info, 'language_probability', 0):.3f}"
          )


          results = []


          for segment in segments:

              text = clean_text(
                  segment.text
              )


              if not text:
                  continue


              start = float(
                  segment.start
              )

              end = float(
                  segment.end
              )

              duration = end - start


              no_speech_prob = float(
                  getattr(
                      segment,
                      "no_speech_prob",
                      0.0
                  )
              )


              avg_logprob = float(
                  getattr(
                      segment,
                      "avg_logprob",
                      0.0
                  )
              )


              compression_ratio = float(
                  getattr(
                      segment,
                      "compression_ratio",
                      0.0
                  )
              )


              if no_speech_prob > 0.97:

                  print(
                      "⚠️ Skipping no-speech:"
                      f" {text}"
                  )

                  continue


              if duration > 30:

                  print(
                      "⚠️ Skipping very long:"
                      f" {duration:.1f}s | {text}"
                  )

                  continue


              if duration > 20:

                  print(
                      "⚠️ Skipping long subtitle:"
                      f" {duration:.1f}s | {text}"
                  )

                  continue


              normalized = normalize_text(
                  text
              )


              if (
                  avg_logprob < -2.5
                  and compression_ratio > 2.8
              ):

                  print(
                      "⚠️ Skipping low-confidence "
                      f"hallucination: {text}"
                  )

                  continue


              duplicate = False


              for previous in results[-8:]:

                  previous_normalized = (
                      normalize_text(
                          previous["text"]
                      )
                  )


                  if (
                      normalized
                      != previous_normalized
                  ):

                      continue


                  gap = (
                      start
                      - previous["end"]
                  )


                  if gap < 10:

                      duplicate = True

                      print(
                          "⚠️ Repeated text removed:"
                          f" {text}"
                      )

                      break


              if duplicate:
                  continue


              words = normalized.split()


              if len(words) >= 5:

                  unique_words = set(
                      words
                  )

                  repetition_ratio = (
                      len(unique_words)
                      / len(words)
                  )


                  if repetition_ratio < 0.34:

                      print(
                          "⚠️ Repeated-word "
                          "hallucination removed:"
                          f" {text}"
                      )

                      continue


              results.append({
                  "start": start,
                  "end": end,
                  "text": text
              })


              print(
                  f"[{format_time(start)} --> "
                  f"{format_time(end)}] "
                  f"{text}"
              )


          # ====================================================
          # FINAL CLEANUP
          # ====================================================

          cleaned_results = []


          for item in results:

              text = item["text"].strip()


              if not text:
                  continue


              normalized = normalize_text(
                  text
              )


              duplicate = False


              for previous in cleaned_results[-8:]:

                  previous_normalized = (
                      normalize_text(
                          previous["text"]
                      )
                  )


                  if (
                      normalized
                      != previous_normalized
                  ):

                      continue


                  gap = (
                      item["start"]
                      - previous["end"]
                  )


                  if gap < 10:

                      duplicate = True

                      break


              if duplicate:
                  continue


              cleaned_results.append(
                  item
              )


          results = cleaned_results


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              for number, item in enumerate(
                  results,
                  start=1
              ):

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{format_time(item['start'])} --> "
                      f"{format_time(item['end'])}\n"
                  )

                  f.write(
                      item["text"]
                  )

                  f.write(
                      "\n\n"
                  )


          print("========================================")

          print(
              f"✅ SRT created: "
              f"{len(results)} subtitle entries"
          )

          print(
              f"📄 Output file: {OUTPUT_FILE}"
          )

          print("========================================")
          PY


