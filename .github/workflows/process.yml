      - name: Extract screen text with OCR
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |

          cat > video_ocr.py <<'PY'
          import cv2
          import pytesseract
          import re


          VIDEO_FILE = "input.mkv"
          OUTPUT_FILE = "screen_text.srt"

          SAMPLE_SECONDS = 1.0

          OCR_LANGUAGES = (
              "eng+sin+hin+mal+tel+tam+ben"
          )


          cap = cv2.VideoCapture(
              VIDEO_FILE
          )


          if not cap.isOpened():

              raise RuntimeError(
                  "Cannot open video."
              )


          fps = cap.get(
              cv2.CAP_PROP_FPS
          )


          if not fps or fps <= 0:
              fps = 25


          total_frames = int(
              cap.get(
                  cv2.CAP_PROP_FRAME_COUNT
              )
          )


          results = []


          last_text = ""
          start_time = None
          last_time = None


          def normalize(text):

              text = text.replace(
                  "\n",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def format_time(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              minutes = (
                  total_ms % 3600000
              ) // 60000

              secs = (
                  total_ms % 60000
              ) // 1000

              milliseconds = (
                  total_ms % 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{milliseconds:03d}"
              )


          def add_result(
              text,
              start,
              end
          ):

              if not text:
                  return

              if start is None:
                  return

              if end <= start:
                  return

              results.append({
                  "text": text,
                  "start": start,
                  "end": end
              })


          frame_index = 0
          next_sample = 0.0


          while True:

              ret, frame = cap.read()

              if not ret:
                  break


              current_time = (
                  frame_index / fps
              )


              if current_time + 0.001 < next_sample:

                  frame_index += 1

                  continue


              next_sample += SAMPLE_SECONDS


              height, width = frame.shape[:2]


              crop_start = int(
                  height * 0.45
              )


              cropped = frame[
                  crop_start:height,
                  0:width
              ]


              cropped = cv2.resize(
                  cropped,
                  None,
                  fx=1.5,
                  fy=1.5,
                  interpolation=cv2.INTER_CUBIC
              )


              try:

                  text = pytesseract.image_to_string(
                      cropped,
                      lang=OCR_LANGUAGES,
                      config="--psm 6"
                  )

              except Exception:

                  frame_index += 1

                  continue


              current_text = normalize(
                  text
              )


              if len(current_text) > 300:
                  current_text = ""


              if current_text == last_text:

                  last_time = current_time

              else:

                  if last_text:

                      add_result(
                          last_text,
                          start_time,
                          last_time + SAMPLE_SECONDS
                      )


                  if current_text:

                      start_time = current_time
                      last_time = current_time

                  else:

                      start_time = None
                      last_time = None


                  last_text = current_text


              frame_index += 1


          cap.release()


          if (
              last_text
              and start_time is not None
          ):

              add_result(
                  last_text,
                  start_time,
                  last_time + SAMPLE_SECONDS
              )


          cleaned = []


          for item in results:

              text = item["text"].strip()


              if len(text) < 2:
                  continue


              if cleaned:

                  previous = cleaned[-1]


                  if (
                      previous["text"] == text
                      and item["start"]
                      <= previous["end"] + 1.5
                  ):

                      previous["end"] = item["end"]

                      continue


              cleaned.append(item)


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              for number, item in enumerate(
                  cleaned,
                  start=1
              ):

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{format_time(item['start'])} --> "
                      f"{format_time(item['end'])}\n"
                  )

                  f.write(
                      item["text"]
                  )

                  f.write(
                      "\n\n"
                  )


          print(
              f"✅ OCR SRT created: "
              f"{len(cleaned)} entries"
          )
          PY


