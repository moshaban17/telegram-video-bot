      # ============================================================

      - name: Install OCR packages
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-sin \
            tesseract-ocr-hin \
            tesseract-ocr-mal \
