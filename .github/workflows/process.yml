name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: false
        type: string
        default: ""

      subtitle_url:
        description: "Direct SRT URL"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "same"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      bot_username:
        description: "Telegram bot username"
        required: false
        type: string
        default: "CinmalekHardsubBot"

      srt_file_id:
        description: "Telegram SRT file ID"
        required: false
        type: string
        default: ""

      telegram_message_id:
        description: "Telegram video message ID"
        required: false
        type: string
        default: ""

      source_type:
        description: "Video source"
        required: false
        type: choice
        options:
          - "url"
          - "telegram"
        default: "url"

      operation:
        description: "Operation"
        required: false
        type: choice
        options:
          - "video"
          - "translate_srt"
          - "video_ocr"
        default: "video"

jobs:

  process:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SRT TRANSLATION
      # ============================================================

      - name: Install Python packages for SRT translation
        if: ${{ inputs.operation == 'translate_srt' }}
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Download SRT from Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SRT_FILE_ID: ${{ inputs.srt_file_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          file_id = os.environ["SRT_FILE_ID"]

          api = f"https://api.telegram.org/bot{token}/getFile"

          r = requests.get(
              api,
              params={"file_id": file_id},
              timeout=30
          )

          r.raise_for_status()

          data = r.json()

          if not data.get("ok"):
              raise RuntimeError(data)

          file_path = data["result"]["file_path"]

          download_url = (
              f"https://api.telegram.org/file/bot"
              f"{token}/{file_path}"
          )

          r = requests.get(
              download_url,
              timeout=120
          )

          r.raise_for_status()

          with open("input.srt", "wb") as f:
              f.write(r.content)

          print("SRT downloaded successfully.")
          PY

      - name: Translate SRT with Gemini
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          cat > translate_srt.py <<'PY'
          import os
          import re
          import time
          from google import genai

          INPUT_FILE = "input.srt"
          OUTPUT_FILE = "arabic.srt"

          MODEL = "gemini-3.8-flash"

          PROMPT = r"""
          أنت مترجم محترف لترجمة الأفلام والمسلسلات إلى العربية الفصحى.

          مهمتك ترجمة نصوص الحوار إلى العربية الفصحى الطبيعية والسينمائية.

          قواعد الترجمة الإلزامية:

          1. افهم المعنى والسياق قبل الترجمة.
          2. لا تترجم الكلمات أو العبارات حرفيًا عندما يكون لها معنى اصطلاحي.
          3. ميّز بين المتحدث والمخاطَب قدر الإمكان من السياق.
          4. راعِ جنس المتحدث والمخاطَب: مذكر/مؤنث.
          5. حافظ على اتساق أسماء الشخصيات والمصطلحات في جميع المقاطع.
          6. إذا تكررت الجملة أو العبارة بنفس المعنى، استخدم نفس الترجمة قدر الإمكان.
          7. الشتائم والإهانات تُترجم بوضوح وبنفس مستوى القوة الموجود في الأصل.
             لا تُلطّف الإهانة ولا تحذفها، ولا تجعلها أقوى من الأصل.
          8. لا تستخدم ترجمة حرفية غريبة للتعبيرات العامية.
          9. مثال:
             Hey man = يا رجل
             Hey Ahmed = يا أحمد
             Wow = يا للروعة
             Oh my God = يا إلهي
          10. حسب السياق:
              Grandpa / Grandfather عند النداء = أيها الجد
              Teacher / Master عند النداء = أيها المعلم
          11. لا تستبدل كلمة God تلقائيًا بـ"الله" إذا كان المقصود في السياق هو "إله".
          12. استخدم العربية الفصحى، وليس العامية المصرية أو الشامية أو الخليجية.
          13. اجعل الجمل طبيعية وقابلة للعرض كترجمة فيلم.
          14. لا تضف شرحًا أو ملاحظات أو تعليقات.
          15. لا تضف علامات اقتباس من عندك.
          16. لا تغيّر أرقام المقاطع أو التوقيتات.
          17. لا تغيّر ترتيب المقاطع.
          18. لا تغيّر أي HTML أو تنسيق موجود داخل النص مثل:
              <i>
              </i>
              <font ...>
              </font>
          19. حافظ على رموز الموسيقى ♪ و ♫ كما هي.
          20. لا تحذف أي مقطع.
          21. لا تضف أي مقطع جديد.
          22. ترجم النص فقط.

          سيتم إعطاؤك مجموعة من مقاطع SRT.

          أعد نفس المقاطع بنفس الأرقام والتوقيتات والترتيب.
          غيّر فقط نص الحوار إلى العربية.

          لا تكتب أي شيء خارج مقاطع SRT.
          """

          def parse_srt(text):
              text = text.replace("\r\n", "\n").replace("\r", "\n")

              blocks = re.split(
                  r"\n\s*\n",
                  text.strip()
              )

              result = []

              for block in blocks:
                  lines = block.split("\n")

                  if len(lines) < 3:
                      continue

                  result.append({
                      "number": lines[0],
                      "timing": lines[1],
                      "text": "\n".join(lines[2:])
                  })

              return result

          def build_srt(blocks):
              output = []

              for block in blocks:
                  output.append(block["number"])
                  output.append(block["timing"])
                  output.append(block["text"])
                  output.append("")

              return "\n".join(output)

          def extract_answer(text):
              text = text.strip()

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines and lines[0].startswith("```"):
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines)

              return text.strip()

          def translate_batch(client, batch):

              source = build_srt(batch)

              prompt = PROMPT + """

          هذه هي المقاطع التي يجب ترجمتها:

          """ + source

              response = client.models.generate_content(
                  model=MODEL,
                  contents=prompt,
                  config={
                      "temperature": 0.2
                  }
              )

              answer = extract_answer(response.text)

              translated = parse_srt(answer)

              if len(translated) != len(batch):
                  raise RuntimeError(
                      f"Gemini returned {len(translated)} blocks "
                      f"but expected {len(batch)}"
                  )

              for original, new in zip(batch, translated):

                  if original["number"] != new["number"]:
                      raise RuntimeError(
                          "Subtitle numbering changed."
                      )

                  if original["timing"] != new["timing"]:
                      raise RuntimeError(
                          "Subtitle timing changed."
                      )

                  original["text"] = new["text"]

              return batch

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig"
          ) as f:
              text = f.read()

          subtitles = parse_srt(text)

          if not subtitles:
              raise RuntimeError(
                  "No valid SRT subtitles found."
              )

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          BATCH_SIZE = 80
          translated_all = []

          for start in range(
              0,
              len(subtitles),
              BATCH_SIZE
          ):

              end = min(
                  start + BATCH_SIZE,
                  len(subtitles)
              )

              batch = subtitles[start:end]

              print(
                  f"Translating subtitles "
                  f"{start + 1} - {end} "
                  f"of {len(subtitles)}"
              )

              translated = translate_batch(
                  client,
                  batch
              )

              translated_all.extend(
                  translated
              )

              if end < len(subtitles):
                  time.sleep(2)

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  build_srt(translated_all)
              )

          print("Translation completed.")
          PY

          python translate_srt.py

      - name: Send translated SRT to Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@arabic.srt" \
            -F "caption=🇸🇦 تمت ترجمة ملف SRT إلى العربية الفصحى بنجاح."

      # ============================================================
      # INSTALL TELEGRAM LIBRARY
      # ============================================================

      - name: Install Telegram library
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' }}
        run: |
          python -m pip install "telethon<2" cryptg

      # ============================================================
      # VIDEO TOOLS
      # ============================================================

      - name: Install video tools
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            aria2

      # ============================================================
      # TELEGRAM VIDEO INPUT
      # ============================================================

      - name: Download video from Telegram
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'video_ocr') && inputs.source_type == 'telegram' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.telegram_message_id }}
          BOT_USERNAME: ${{ inputs.bot_username }}
        run: |

          cat > download_telegram.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          async def main():

              api_id = int(os.environ["API_ID"])
              api_hash = os.environ["API_HASH"]
              session = os.environ["TG_SESSION"]

              chat_id = int(os.environ["CHAT_ID"])
              message_id = int(os.environ["MESSAGE_ID"])

              bot_username = (
                  os.environ["BOT_USERNAME"]
                  .strip()
                  .lstrip("@")
              )

              print("========================================")
              print("🔍 Telegram diagnostic")
              print("========================================")
              print(f"Chat ID       : {chat_id}")
              print(f"Message ID    : {message_id}")
              print(f"Bot username  : @{bot_username}")


              client = TelegramClient(
                  StringSession(session),
                  api_id,
                  api_hash
              )

              await client.start()


              # ------------------------------------------------
              # معرفة الحساب المستخدم
              # ------------------------------------------------

              me = await client.get_me()

              print(
                  f"👤 Session account: "
                  f"{getattr(me, 'first_name', '')} "
                  f"{getattr(me, 'last_name', '') or ''}"
              )

              print(
                  f"🆔 Session user ID: {me.id}"
              )

              print(
                  f"🤖 Is bot session: "
                  f"{getattr(me, 'bot', False)}"
              )


              # ------------------------------------------------
              # تحميل الـ dialogs أولًا
              # ------------------------------------------------

              print("🔄 Loading Telegram dialogs...")

              dialogs = await client.get_dialogs(
                  limit=None
              )

              print(
                  f"📋 Loaded {len(dialogs)} dialogs."
              )


              # ------------------------------------------------
              # البحث عن البوت داخل الـ dialogs
              # ------------------------------------------------

              entity = None

              for dialog in dialogs:

                  dialog_entity = dialog.entity

                  username = getattr(
                      dialog_entity,
                      "username",
                      None
                  )

                  if (
                      username
                      and username.lower()
                      == bot_username.lower()
                  ):

                      entity = dialog_entity

                      print(
                          "✅ Bot found inside Telegram dialogs."
                      )

                      print(
                          f"   Username: @{username}"
                      )

                      print(
                          f"   ID: {entity.id}"
                      )

                      break


              # ------------------------------------------------
              # إذا لم يوجد في dialogs نستخدم username
              # ------------------------------------------------

              if entity is None:

                  print(
                      f"⚠️ Bot not found in dialogs."
                  )

                  print(
                      f"🔎 Resolving @{bot_username} directly..."
                  )

                  try:

                      entity = await client.get_entity(
                          f"@{bot_username}"
                      )

                      print(
                          "✅ Bot chat resolved directly."
                      )

                      print(
                          f"   Username: "
                          f"@{getattr(entity, 'username', bot_username)}"
                      )

                      print(
                          f"   ID: {entity.id}"
                      )

                  except Exception as e:

                      await client.disconnect()

                      print(
                          f"❌ Could not find bot: {e}"
                      )

                      raise RuntimeError(
                          "Telegram bot could not be resolved."
                      )


              # ------------------------------------------------
              # البحث المباشر عن الرسالة
              # ------------------------------------------------

              print(
                  "========================================"
              )

              print(
                  f"🔎 Looking for message ID {message_id}..."
              )

              print(
                  f"🎯 Target bot ID: {entity.id}"
              )

              message = None


              try:

                  found_messages = await client.get_messages(
                      entity,
                      ids=[message_id]
                  )

                  if found_messages:

                      if isinstance(
                          found_messages,
                          list
                      ):

                          for item in found_messages:

                              if (
                                  item
                                  and item.id
                                  == message_id
                              ):

                                  message = item
                                  break

                      else:

                          if (
                              found_messages.id
                              == message_id
                          ):

                              message = found_messages


              except Exception as e:

                  print(
                      f"⚠️ Direct lookup error: {e}"
                  )


              if message:

                  print(
                      "✅ Message found by direct lookup!"
                  )

                  print(
                      f"Message ID : {message.id}"
                  )

                  print(
                      f"Message date: {message.date}"
                  )

                  print(
                      f"Sender ID  : "
                      f"{getattr(message.sender_id, 'id', message.sender_id)}"
                  )

                  print(
                      f"Has media  : {bool(message.media)}"
                  )


              else:

                  # ------------------------------------------------
                  # محاولة ثانية باستخدام نافذة ID محددة
                  # ------------------------------------------------

                  print(
                      "⚠️ Direct lookup did not find the message."
                  )

                  print(
                      "🔎 Trying history around the requested ID..."
                  )

                  try:

                      nearby = await client.get_messages(
                          entity,
                          limit=10,
                          min_id=max(0, message_id - 5),
                          max_id=message_id + 5
                      )

                      for item in nearby:

                          print(
                              f"   Nearby ID: {item.id} | "
                              f"Media: {bool(item.media)} | "
                              f"Date: {item.date}"
                          )

                          if item.id == message_id:

                              message = item

                              print(
                                  "✅ Message found in ID window!"
                              )

                              break

                  except Exception as e:

                      print(
                          f"⚠️ History lookup error: {e}"
                      )


              if message:

                  print(
                      "========================================"
                  )

                  print(
                      "✅ Telegram message found!"
                  )

                  print(
                      f"Message ID: {message.id}"
                  )

                  print(
                      f"Has media: {bool(message.media)}"
                  )

                  print(
                      "========================================"
                  )


              else:

                  # ------------------------------------------------
                  # تشخيص آخر 20 رسالة
                  # ------------------------------------------------

                  print(
                      "========================================"
                  )

                  print(
                      "⚠️ Message still NOT found."
                  )

                  print(
                      "🔎 Reading latest 20 messages..."
                  )

                  count = 0

                  async for item in client.iter_messages(
                      entity,
                      limit=20
                  ):

                      count += 1

                      print(
                          f"   Message ID: {item.id} | "
                          f"Media: {bool(item.media)} | "
                          f"Date: {item.date}"
                      )

                  print(
                      f"📋 Checked {count} recent messages."
                  )

                  print(
                      "========================================"
                  )

                  print(
                      "❌ MESSAGE NOT FOUND"
                  )

                  print(
                      f"Bot         : @{bot_username}"
                  )

                  print(
                      f"Bot ID      : {entity.id}"
                  )

                  print(
                      f"Chat ID     : {chat_id}"
                  )

                  print(
                      f"Message ID  : {message_id}"
                  )

                  print(
                      "========================================"
                  )

                  await client.disconnect()

                  raise RuntimeError(
                      "Telegram message not found."
                  )


              # ------------------------------------------------
              # التأكد من وجود ملف
              # ------------------------------------------------

              if not message.media:

                  await client.disconnect()

                  raise RuntimeError(
                      "Telegram message has no media."
                  )


              print(
                  "📥 Downloading video from Telegram..."
              )


              path = await message.download_media(
                  file="input.mkv"
              )


              if not path:

                  await client.disconnect()

                  raise RuntimeError(
                      "Telegram video download failed."
                  )


              print(
                  f"✅ Telegram video downloaded: {path}"
              )


              size = os.path.getsize(path)

              size_mb = size / 1024 / 1024

              print(
                  f"📦 File size: {size_mb:.2f} MB"
              )


              await client.disconnect()


          asyncio.run(main())
          PY

          python download_telegram.py

      # ============================================================
      # URL VIDEO INPUT
      # ============================================================

      - name: Download video from URL
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'video_ocr') && inputs.source_type == 'url' }}
        run: |

          if [ -z "${{ inputs.video_url }}" ]; then
            echo "❌ video_url is empty."
            exit 1
          fi

          echo "📥 Downloading video from URL..."

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --continue=true \
            --summary-interval=5 \
            --console-log-level=notice \
            -o input.mkv \
            "${{ inputs.video_url }}"

      # ============================================================
      # OCR
      # ============================================================

      - name: Install OCR packages
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-sin \
            tesseract-ocr-hin \
            tesseract-ocr-mal \
            tesseract-ocr-tel \
            tesseract-ocr-tam \
            tesseract-ocr-ben

          python -m pip install --upgrade pip

          pip install \
            opencv-python-headless \
            pytesseract

      - name: Extract screen text with OCR
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |

          cat > video_ocr.py <<'PY'
          import cv2
          import pytesseract
          import re

          VIDEO_FILE = "input.mkv"
          OUTPUT_FILE = "screen_text.srt"

          SAMPLE_SECONDS = 1.0

          OCR_LANGUAGES = (
              "eng+sin+hin+mal+tel+tam+ben"
          )

          cap = cv2.VideoCapture(VIDEO_FILE)

          if not cap.isOpened():
              raise RuntimeError(
                  "Cannot open video."
              )

          fps = cap.get(
              cv2.CAP_PROP_FPS
          )

          if not fps or fps <= 0:
              fps = 25

          total_frames = int(
              cap.get(
                  cv2.CAP_PROP_FRAME_COUNT
              )
          )

          duration = (
              total_frames / fps
              if total_frames > 0
              else 0
          )

          print(f"🎬 FPS: {fps}")
          print(f"⏱️ Duration: {duration:.2f} seconds")

          results = []

          last_text = ""
          start_time = None
          last_time = None

          def normalize(text):

              text = text.replace(
                  "\n",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          def format_time(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              minutes = (
                  total_ms % 3600000
              ) // 60000

              secs = (
                  total_ms % 60000
              ) // 1000

              milliseconds = (
                  total_ms % 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{milliseconds:03d}"
              )

          def add_result(
              text,
              start,
              end
          ):

              if not text:
                  return

              if start is None:
                  return

              if end <= start:
                  return

              results.append({
                  "text": text,
                  "start": start,
                  "end": end
              })

          frame_index = 0
          next_sample = 0.0

          while True:

              ret, frame = cap.read()

              if not ret:
                  break

              current_time = (
                  frame_index / fps
              )

              if (
                  current_time + 0.001
                  < next_sample
              ):

                  frame_index += 1
                  continue

              next_sample += SAMPLE_SECONDS

              height, width = frame.shape[:2]

              crop_start = int(
                  height * 0.45
              )

              cropped = frame[
                  crop_start:height,
                  0:width
              ]

              cropped = cv2.resize(
                  cropped,
                  None,
                  fx=1.5,
                  fy=1.5,
                  interpolation=cv2.INTER_CUBIC
              )

              try:

                  text = pytesseract.image_to_string(
                      cropped,
                      lang=OCR_LANGUAGES,
                      config="--psm 6"
                  )

              except Exception as e:

                  print(
                      f"OCR error at "
                      f"{current_time:.2f}s: {e}"
                  )

                  frame_index += 1
                  continue

              current_text = normalize(text)

              if len(current_text) > 300:
                  current_text = ""

              if current_text == last_text:

                  last_time = current_time

              else:

                  if last_text:

                      add_result(
                          last_text,
                          start_time,
                          last_time + SAMPLE_SECONDS
                      )

                  if current_text:

                      start_time = current_time
                      last_time = current_time

                  else:

                      start_time = None
                      last_time = None

                  last_text = current_text

              if frame_index % int(
                  max(1, fps * 30)
              ) == 0:

                  print(
                      f"🔎 OCR progress: "
                      f"{current_time:.0f}s / "
                      f"{duration:.0f}s"
                  )

              frame_index += 1

          cap.release()

          if (
              last_text
              and start_time is not None
          ):

              add_result(
                  last_text,
                  start_time,
                  last_time + SAMPLE_SECONDS
              )

          cleaned = []

          for item in results:

              text = item["text"].strip()

              if len(text) < 2:
                  continue

              if cleaned:

                  previous = cleaned[-1]

                  if (
                      previous["text"] == text
                      and item["start"]
                      <= previous["end"] + 1.5
                  ):

                      previous["end"] = item["end"]
                      continue

              cleaned.append(item)

          print(
              f"📝 Detected "
              f"{len(cleaned)} "
              f"screen-text entries."
          )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              number = 1

              for item in cleaned:

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{format_time(item['start'])} --> "
                      f"{format_time(item['end'])}\n"
                  )

                  f.write(
                      item["text"]
                  )

                  f.write(
                      "\n\n"
                  )

                  number += 1

          print(
              "✅ OCR SRT creation completed."
          )
          PY

          python video_ocr.py

      - name: Send OCR SRT to Telegram
        if: ${{ inputs.operation == 'video_ocr' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@screen_text.srt" \
            -F "caption=👁️ تم استخراج الكلام الظاهر على الشاشة إلى SRT."

      # ============================================================
      # VIDEO PROCESSING
      # ============================================================

      - name: Install FFmpeg fonts
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |
          sudo apt-get install -y fonts-noto-core

      - name: Download subtitle
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          aria2c \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=1M \
            --file-allocation=none \
            -o subtitle.srt \
            "${{ inputs.subtitle_url }}"

      - name: Set resolution
        if: ${{ inputs.operation == 'video' && inputs.resolution != 'same' }}
        run: |

          case "${{ inputs.resolution }}" in

            "1080p")
              echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV"
              ;;

            "720p")
              echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV"
              ;;

            "480p")
              echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV"
              ;;

            "360p")
              echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV"
              ;;

          esac

      - name: Process video with subtitle
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          if [ "${SCALE_FILTER:-}" = "" ]; then

            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2'"

          else

            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2',${SCALE_FILTER}"

          fi

          ffmpeg -y \
            -i input.mkv \
            -vf "$VIDEO_FILTER" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Convert resolution
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url == '' && inputs.resolution != 'same' }}
        run: |

          ffmpeg -y \
            -i input.mkv \
            -vf "${SCALE_FILTER}" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Keep original video
        if: ${{ inputs.operation == 'video' && inputs.resolution == 'same' && inputs.subtitle_url == '' }}
        run: |

          cp input.mkv output.mkv

      - name: Select output
        if: ${{ inputs.operation == 'video' }}
        run: |

          if [ "${{ inputs.resolution }}" = "same" ] && [ "${{ inputs.subtitle_url }}" = "" ]; then

            echo "OUTPUT_FILE=output.mkv" >> "$GITHUB_ENV"

          else

            echo "OUTPUT_FILE=output.mp4" >> "$GITHUB_ENV"

          fi

      # ============================================================
      # SEND VIDEO TO TELEGRAM
      # ============================================================

      - name: Send video result to Telegram
        if: ${{ inputs.operation == 'video' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |

          cat > send.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(
                      os.environ["API_ID"]
                  ),
                  os.environ["API_HASH"]
              )

              await client.start()

              print(
                  "📤 Starting Telegram upload..."
              )

              await client.send_file(
                  int(
                      os.environ["CHAT_ID"]
                  ),
                  os.environ["OUTPUT_FILE"],
                  caption="🎬 تم تجهيز الفيلم بنجاح.",
                  video=True,
                  supports_streaming=True
              )

              print(
                  "✅ Telegram upload completed."
              )

              await client.disconnect()


          asyncio.run(main())
          PY

          python send.py

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean files
        if: always()
        run: |

          rm -f input.mkv
          rm -f output.mkv
          rm -f output.mp4
          rm -f subtitle.srt
          rm -f input.srt
          rm -f arabic.srt
          rm -f screen_text.srt
          rm -f send.py
          rm -f download_telegram.py
          rm -f translate_srt.py
          rm -f video_ocr.py
