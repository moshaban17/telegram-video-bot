name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: true
        type: string

      subtitle_url:
        description: "Direct SRT URL (optional)"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "720p"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget fonts-noto-core

      - name: Download video
        run: |
          wget -O input.mkv "${{ inputs.video_url }}"

      - name: Download subtitle if provided
        if: ${{ inputs.subtitle_url != '' }}
        run: |
          wget -O subtitle.srt "${{ inputs.subtitle_url }}"

      - name: Set resolution
        run: |
          case "${{ inputs.resolution }}" in
            "same")
              echo "SCALE_FILTER=null" >> "$GITHUB_ENV"
              ;;
            "1080p")
              echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV"
              ;;
            "720p")
              echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV"
              ;;
            "480p")
              echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV"
              ;;
            "360p")
              echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Process video with subtitle
        if: ${{ inputs.subtitle_url != '' }}
        run: |
          if [ "${SCALE_FILTER}" = "null" ]; then
            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2'"
          else
            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2',${SCALE_FILTER}"
          fi

          ffmpeg -y \
            -i input.mkv \
            -vf "$VIDEO_FILTER" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Process video without subtitle
        if: ${{ inputs.subtitle_url == '' }}
        run: |
          ffmpeg -y \
            -i input.mkv \
            -vf "${SCALE_FILTER}" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Send result to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python -m pip install "telethon<2" cryptg

          cat > send.py <<'PY'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              await client.send_file(
                  int(os.environ["CHAT_ID"]),
                  "output.mp4",
                  caption="🎬 تم تجهيز الفيلم بنجاح.",
                  video=True,
                  supports_streaming=True
              )

              await client.disconnect()

          asyncio.run(main())
          PY

          python send.py

      - name: Clean files
        if: always()
        run: |
          rm -f input.mkv subtitle.srt output.mp4 send.py
