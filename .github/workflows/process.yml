name: Video Processor
on:
  workflow_dispatch:
    inputs:
      video_url: {description: "Video URL", required: false, default: ""}
      subtitle_url: {description: "Subtitle URL", required: false, default: ""}
      resolution: {description: "Resolution", required: true, type: choice, options: [same, 1080p, 720p, 480p, 360p], default: same}
      chat_id: {description: "Telegram Chat ID", required: true, default: ""}
      operation: {description: "Operation", required: true, type: choice, options: [video, translate_srt], default: video}
      telegram_message_id: {description: "Telegram video message ID", required: false, type: string, default: ""}
      telegram_message_date: {description: "Telegram video message date", required: false, type: string, default: ""}
      subtitle_message_id: {description: "Telegram subtitle message ID", required: false, type: string, default: ""}
      subtitle_message_date: {description: "Telegram subtitle message date", required: false, type: string, default: ""}
      subtitle_type: {description: "Subtitle type", required: false, type: string, default: "srt"}
      font_message_id: {description: "Telegram font message ID", required: false, type: string, default: ""}
      font_message_date: {description: "Telegram font message date", required: false, type: string, default: ""}
      font_size: {description: "Subtitle font size", required: false, type: string, default: "26"}
      font_color: {description: "Subtitle color", required: false, type: string, default: "white"}
      subtitle_outline: {description: "Subtitle outline", required: false, type: string, default: "0.5"}
      subtitle_box: {description: "Subtitle box", required: false, type: string, default: "off"}
      watermark_message_id: {description: "Telegram watermark message ID", required: false, type: string, default: ""}
      watermark_message_date: {description: "Telegram watermark message date", required: false, type: string, default: ""}
      watermark_position: {description: "Watermark position", required: false, type: string, default: "top_left"}
      watermark_size: {description: "Watermark size", required: false, type: string, default: "20"}
      watermark_enabled: {description: "Watermark enabled", required: false, type: string, default: "false"}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget curl file fontconfig fonts-noto-core fonts-noto-cjk fonts-noto-extra unrar tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python -m pip install --upgrade pip
          python -m pip install "telethon<2" cryptg requests
      - name: Show operation
        run: |
          echo "======================================"
          echo "Operation: ${{ inputs.operation }}"
          echo "Resolution: ${{ inputs.resolution }}"
          echo "Chat ID: ${{ inputs.chat_id }}"
          echo "======================================"
      - name: Download video
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt' }}
        env: {API_ID: "${{ secrets.API_ID }}", API_HASH: "${{ secrets.API_HASH }}", TG_SESSION: "${{ secrets.TG_SESSION }}", BOT_USERNAME: "@CinmalekHardsubBot", VIDEO_URL: "${{ inputs.video_url }}", VIDEO_MESSAGE_ID: "${{ inputs.telegram_message_id }}", VIDEO_MESSAGE_DATE: "${{ inputs.telegram_message_date }}"}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            wget --continue --tries=3 --timeout=60 -O input.mkv "$VIDEO_URL"
          else
            cat > download_video.py  download_subtitle.py  download_font.py  selected_font.txt
            if [ -s selected_font.txt ]; then
              FONT_PATH="$(cat selected_font.txt)"
              FONT_NAME="$(fc-scan --format='%{family}' "$FONT_PATH" | head -n 1)"
              if [ -n "$FONT_NAME" ]; then
                mkdir -p "$HOME/.local/share/fonts"; cp "$FONT_PATH" "$HOME/.local/share/fonts/"; fc-cache -f "$HOME/.local/share/fonts"
                echo "FONT_PATH=$FONT_PATH" >> "$GITHUB_ENV"; echo "FONT_NAME=$FONT_NAME" >> "$GITHUB_ENV"
              fi
            fi
          fi
      - name: Download watermark
        if: ${{ inputs.operation == 'video' }}
        env: {API_ID: "${{ secrets.API_ID }}", API_HASH: "${{ secrets.API_HASH }}", TG_SESSION: "${{ secrets.TG_SESSION }}", BOT_USERNAME: "@CinmalekHardsubBot", WATERMARK_MESSAGE_ID: "${{ inputs.watermark_message_id }}", WATERMARK_ENABLED: "${{ inputs.watermark_enabled }}"}
        run: |
          if [ "$WATERMARK_ENABLED" = "true" ] && [ -n "$WATERMARK_MESSAGE_ID" ] && [ "$WATERMARK_MESSAGE_ID" != "\"\"" ]; then
            cat > download_watermark.py  "$GITHUB_ENV"; echo "FONT_COLOR=${{ inputs.font_color }}" >> "$GITHUB_ENV"
          echo "SUBTITLE_OUTLINE=${{ inputs.subtitle_outline }}" >> "$GITHUB_ENV"; echo "SUBTITLE_BOX=${{ inputs.subtitle_box }}" >> "$GITHUB_ENV"
          echo "WATERMARK_POSITION=${{ inputs.watermark_position }}" >> "$GITHUB_ENV"; echo "WATERMARK_SIZE=${{ inputs.watermark_size }}" >> "$GITHUB_ENV"
          echo "WATERMARK_ENABLED=${{ inputs.watermark_enabled }}" >> "$GITHUB_ENV"
      - name: Set resolution
        if: ${{ inputs.operation == 'video' }}
        run: |
          case "${{ inputs.resolution }}" in
            same)  echo "SCALE_FILTER=null" >> "$GITHUB_ENV" ;;
            1080p) echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV" ;;
            720p)  echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV" ;;
            480p)  echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV" ;;
            360p)  echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV" ;;
            *)     echo "❌ دقة غير صحيحة."; exit 1 ;;
          esac
      - name: Process video
        if: ${{ inputs.operation == 'video' }}
        run: |
          FILTERS=""
          if [ -f subtitle.ass ]; then FILTERS="subtitles='subtitle.ass'"
          elif [ -f subtitle.ssa ]; then FILTERS="subtitles='subtitle.ssa'"
          elif [ -f subtitle.srt ]; then
            COLOR="&H00FFFFFF"
            case "$FONT_COLOR" in
              white)  COLOR="&H00FFFFFF" ;;
              yellow) COLOR="&H0000FFFF" ;;
              cyan)   COLOR="&H00FFFF00" ;;
              green)  COLOR="&H0000FF00" ;;
              red)    COLOR="&H000000FF" ;;
              *)      COLOR="&H00FFFFFF" ;;
            esac
            REAL_FONT="${FONT_NAME:-Noto Sans CJK HK}"
            if [ "$SUBTITLE_BOX" = "on" ]; then
              FORCE_STYLE="FontName=${REAL_FONT},FontSize=${FONT_SIZE},PrimaryColour=${COLOR},OutlineColour=&H00000000,Outline=0,Shadow=0,BorderStyle=3,BackColour=&H00000000,Alignment=2"
            else
              FORCE_STYLE="FontName=${REAL_FONT},FontSize=${FONT_SIZE},PrimaryColour=${COLOR},OutlineColour=&H00000000,Outline=${SUBTITLE_OUTLINE},Shadow=0,Alignment=2"
            fi
            FILTERS="subtitles='subtitle.srt':force_style='${FORCE_STYLE}'"
          fi
          if [ -n "$FILTERS" ] && [ "$SCALE_FILTER" != "null" ]; then FILTERS="${FILTERS},${SCALE_FILTER}"
          elif [ -z "$FILTERS" ] && [ "$SCALE_FILTER" != "null" ]; then FILTERS="$SCALE_FILTER"; fi
          if [ "$WATERMARK_ENABLED" = "true" ] && [ -f watermark.png ]; then
            WM_SIZE="${WATERMARK_SIZE:-20}"
            case "$WATERMARK_POSITION" in
              top_left)     WM_OVERLAY="20:20" ;;
              top_right)    WM_OVERLAY="main_w-overlay_w-20:20" ;;
              bottom_left)  WM_OVERLAY="20:main_h-overlay_h-20" ;;
              bottom_right) WM_OVERLAY="main_w-overlay_w-20:main_h-overlay_h-20" ;;
              *)            WM_OVERLAY="20:20" ;;
            esac
            if [ -n "$FILTERS" ]; then ffmpeg -y -i input.mkv -i watermark.png -filter_complex "[0:v]${FILTERS}[base];[1:v][base]scale2ref=w=rw*${WM_SIZE}/100:h=-1[wm][video];[video][wm]overlay=${WM_OVERLAY}[v]" -map "[v]" -map 0:a? -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 192k -movflags +faststart output.mp4
            else ffmpeg -y -i input.mkv -i watermark.png -filter_complex "[1:v][0:v]scale2ref=w=rw*${WM_SIZE}/100:h=-1[wm][video];[video][wm]overlay=${WM_OVERLAY}[v]" -map "[v]" -map 0:a? -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 192k -movflags +faststart output.mp4; fi
          else
            if [ -n "$FILTERS" ]; then ffmpeg -y -i input.mkv -vf "${FILTERS}" -map 0:v:0 -map 0:a? -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 192k -movflags +faststart output.mp4
            else ffmpeg -y -i input.mkv -map 0:v:0 -map 0:a? -c:v libx264 -preset veryfast -crf 23 -c:a aac -b:a 192k -movflags +faststart output.mp4; fi
          fi
      - name: Speech to SRT
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |
          python -m pip install faster-whisper
          cat > speech_to_srt.py <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe("input.mkv", beam_size=5, vad_filter=True)
          def timestamp(sec):
              ms = int(round(sec * 1000))
              return f"{ms//3600000:02d}:{(ms%3600000)//60000:02d}:{(ms%60000)//1000:02d},{ms%1000:03d}"
          with open("speech_result.srt", "w", encoding="utf-8") as f:
              for i, seg in enumerate(segments, 1):
                  t = seg.text.strip()
                  if t: f.write(f"{i}\n{timestamp(seg.start)} --> {timestamp(seg.end)}\n{t}\n\n")
          PY
          python speech_to_srt.py
      - name: OCR to SRT
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |
          python -m pip install opencv-python-headless
          cat > ocr_to_srt.py <<'PY'
          import cv2, subprocess, re
          cap = cv2.VideoCapture("input.mkv")
          fps = cap.get(cv2.CAP_PROP_FPS) or 25; duration = cap.get(cv2.CAP_PROP_FRAME_COUNT) / fps
          def timestamp(sec):
              ms = int(round(sec * 1000))
              return f"{ms//3600000:02d}:{(ms%3600000)//60000:02d}:{(ms%60000)//1000:02d},{ms%1000:03d}"
          results, current, last_text = [], 0.0, ""
          while current < duration:
              cap.set(cv2.CAP_PROP_POS_MSEC, current * 1000); ok, frame = cap.read()
              if not ok: break
              h, w = frame.shape[:2]; cv2.imwrite("ocr_frame.png", frame[int(h*0.55):int(h*0.98), 0:w])
              proc = subprocess.run(["tesseract", "ocr_frame.png", "stdout", "-l", "ara+eng", "--psm", "6"], capture_output=True, text=True)
              text = re.sub(r"\s+", " ", proc.stdout).strip()
              if text and text != last_text: results.append((current, current + 1.0, text)); last_text = text
              current += 1.0
          cap.release()
          with open("ocr_result.srt", "w", encoding="utf-8") as f:
              for i, (s, e, t) in enumerate(results, 1): f.write(f"{i}\n{timestamp(s)} --> {timestamp(e)}\n{t}\n\n")
          PY
          python ocr_to_srt.py
      - name: Download SRT for translation
        if: ${{ inputs.operation == 'translate_srt' }}
        env: {BOT_TOKEN: "${{ secrets.BOT_TOKEN }}", SRT_FILE_ID: "${{ inputs.srt_file_id }}"}
        run: |
          FILE_INFO="$(curl -fsS "https://telegram.org{BOT_TOKEN}/getFile?file_id=${SRT_FILE_ID}")"
          FILE_PATH="$(python -c 'import json, sys; print(json.load(sys.stdin)["result"]["file_path"])' <<< "$FILE_INFO")"
          curl -fL -o source.srt "https://telegram.org{BOT_TOKEN}/${FILE_PATH}"
      - name: Translate SRT with Gemini
        if: ${{ inputs.operation == 'translate_srt' }}
        env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
        run: |
          cat > translate_srt.py <<'PY'
          import os, re, time, requests
          API_KEY = os.environ["GEMINI_API_KEY"]
          URL = f"https://googleapis.com{API_KEY}"
          def translate_text(text):
              prompt = f"أنت مترجم محترف للترجمة السينمائية. ترجم النصوص التالية للعربية الفصحى مع الحفاظ على كتل التوقيت والوسوم بالكامل وبدون ماركداون:\n\n{text}"
              res = requests.post(URL, json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=180)
              return res.json()["candidates"]["content"]["parts"]["text"].strip()
          with open("source.srt", "r", encoding="utf-8-sig") as f: source = f.read()
          blocks = re.split(r"\n\s*\n", source.strip()); trans_blocks = []
          for start in range(0, len(blocks), 40):
              batch = blocks[start:start+40]; trans = translate_text("\n\n".join(batch))
              trans = re.sub(r"^```(?:srt)?\s*|\s*```$", "", trans, flags=re.IGNORECASE).strip()
              trans_blocks.extend(re.split(r"\n\s*\n", trans)); time.sleep(1)
          with open("translated.srt", "w", encoding="utf-8") as f: f.write("\n\n".join(trans_blocks) + "\n")
          PY
          python translate_srt.py
      - name: Send SRT result
        if: ${{ inputs.operation == 'audio_srt' || inputs.operation == 'video_ocr' || inputs.operation == 'translate_srt' }}
        env: {API_ID: "${{ secrets.API_ID }}", API_HASH: "${{ secrets.API_HASH }}", TG_SESSION: "${{ secrets.TG_SESSION }}", CHAT_ID: "${{ inputs.chat_id }}", OPERATION: "${{ inputs.operation }}"}
        run: |
          cat > send_srt.py <<'PY'
          import os, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          async def main():
              client = TelegramClient(StringSession(os.environ["TG_SESSION"]), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.start(); op = os.environ["OPERATION"]
              fn = "speech_result.srt" if op=="audio_srt" else ("ocr_result.srt" if op=="video_ocr" else "translated.srt")
              cap = "🎙️ تم تحويل الكلام" if op=="audio_srt" else ("👁️ تم استخراج الكلام" if op=="video_ocr" else "🌐 تمت الترجمة")
              await client.send_file(int(os.environ["CHAT_ID"]), fn, caption=cap, force_document=True); await client.disconnect()
          asyncio.run(main())
          PY
          python send_srt.py
      - name: Send video to Telegram
        if: ${{ inputs.operation == 'video' }}
        env: {API_ID: "${{ secrets.API_ID }}", API_HASH: "${{ secrets.API_HASH }}", TG_SESSION: "${{ secrets.TG_SESSION }}", CHAT_ID: "${{ inputs.chat_id }}"}
        run: |
          cat > send_video.py <<'PY'
          import os, asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          async def main():
              client = TelegramClient(StringSession(os.environ["TG_SESSION"]), int(os.environ["API_ID"]), os.environ["API_HASH"])
              await client.start()
              await client.send_file(int(os.environ["CHAT_ID"]), "output.mp4", caption="🎬 تم تجهيز الفيديو بنجاح.", video=True, supports_streaming=True); await client.disconnect()
          asyncio.run(main())
          PY
          python send_video.py
      - name: Clean files
        if: always()
        run: rm -rf input.mkv output.mp4 source.srt translated.srt speech_result.srt ocr_result.srt subtitle.* font_source watermark_source *.png *.txt *.py custom_fonts watermark_extract
