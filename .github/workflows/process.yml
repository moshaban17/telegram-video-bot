name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: false
        type: string

      subtitle_url:
        description: "Direct SRT URL (optional)"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "720p"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      telegram_message_id:
        description: "Telegram video message ID"
        required: false
        type: string
        default: ""

      subtitle_message_id:
        description: "Telegram subtitle message ID"
        required: false
        type: string
        default: ""

      subtitle_type:
        description: "Subtitle type"
        required: false
        type: string
        default: "srt"

      font_message_id:
        description: "Telegram font message ID"
        required: false
        type: string
        default: ""

      font_size:
        description: "Subtitle font size"
        required: false
        type: string
        default: "26"

      font_color:
        description: "Subtitle color"
        required: false
        type: string
        default: "white"

      subtitle_outline:
        description: "Subtitle outline"
        required: false
        type: string
        default: "0.5"

      subtitle_box:
        description: "Subtitle box"
        required: false
        type: string
        default: "off"

      watermark_message_id:
        description: "Telegram watermark message ID"
        required: false
        type: string
        default: ""

      watermark_position:
        description: "Watermark position"
        required: false
        type: string
        default: "top_left"

      watermark_size:
        description: "Watermark size"
        required: false
        type: string
        default: "20"

      watermark_enabled:
        description: "Watermark enabled"
        required: false
        type: string
        default: "false"


jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget fonts-noto-core

      - name: Download video
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: "@cinmalekbot"
          VIDEO_MESSAGE_ID: ${{ inputs.telegram_message_id }}
        run: |
          python -m pip install "telethon<2" cryptg

          cat > download_video.py <<'PYTHON'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              message = await client.get_messages(
                  os.environ["BOT_USERNAME"],
                  ids=int(os.environ["VIDEO_MESSAGE_ID"])
              )

              if not message:
                  raise RuntimeError(
                      f"لم يتم العثور على رسالة تيليجرام رقم {os.environ['VIDEO_MESSAGE_ID']} "
                      f"في المحادثة {os.environ['CHAT_ID']}."
                  )

              print("🔎 Telegram message ID:", message.id)
              print("🔎 Message media:", message.media)
              print("🔎 Message document:", message.document)
              print("🔎 Message video:", message.video)
              print("🔎 Message photo:", message.photo)

              if not message.media:
                  raise RuntimeError(
                      f"تم العثور على الرسالة {message.id} لكن لا يوجد Media داخلها."
                  )

              await client.download_media(
                  message,
                  file="input.mkv"
              )

              await client.disconnect()

          asyncio.run(main())
          PYTHON

          python download_video.py

      - name: Download subtitle if provided
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: "@cinmalekbot"
          SUBTITLE_MESSAGE_ID: ${{ inputs.subtitle_message_id }}
          SUBTITLE_TYPE: ${{ inputs.subtitle_type }}
          SUBTITLE_URL: ${{ inputs.subtitle_url }}
        run: |
          if [ -n "$SUBTITLE_MESSAGE_ID" ]; then
            python -m pip install "telethon<2" cryptg

            cat > download_subtitle.py <<'PYTHON'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              message = await client.get_messages(
                  os.environ["BOT_USERNAME"],
                  ids=int(os.environ["SUBTITLE_MESSAGE_ID"])
              )

              if not message or not message.media:
                  raise RuntimeError("لم يتم العثور على ملف الترجمة.")

              ext = ".ass" if os.environ["SUBTITLE_TYPE"].lower() in ("ass", "ssa") else ".srt"

              await client.download_media(
                  message,
                  file="subtitle" + ext
              )

              await client.disconnect()

          asyncio.run(main())
          PYTHON

            python download_subtitle.py

          elif [ -n "$SUBTITLE_URL" ]; then
            wget -O subtitle.srt "$SUBTITLE_URL"
          fi

      - name: Download watermark if enabled
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: "@cinmalekbot"
          WATERMARK_MESSAGE_ID: ${{ inputs.watermark_message_id }}
          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}
        run: |
          if [ "$WATERMARK_ENABLED" = "true" ] && [ -n "$WATERMARK_MESSAGE_ID" ]; then
            python -m pip install "telethon<2" cryptg

            cat > download_watermark.py <<'PYTHON'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              message = await client.get_messages(
                  os.environ["BOT_USERNAME"],
                  ids=int(os.environ["WATERMARK_MESSAGE_ID"])
              )

              if not message or not message.media:
                  raise RuntimeError("لم يتم العثور على العلامة المائية.")

              await client.download_media(
                  message,
                  file="watermark_source"
              )

              await client.disconnect()

          asyncio.run(main())
          PYTHON

            python download_watermark.py
          fi

      - name: Download font if provided
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: "@cinmalekbot"
          FONT_MESSAGE_ID: ${{ inputs.font_message_id }}
        run: |
          if [ -n "$FONT_MESSAGE_ID" ]; then
            python -m pip install "telethon<2" cryptg

            cat > download_font.py <<'PYTHON'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              message = await client.get_messages(
                  os.environ["BOT_USERNAME"],
                  ids=int(os.environ["FONT_MESSAGE_ID"])
              )

              if not message or not message.media:
                  raise RuntimeError("لم يتم العثور على ملف الخط.")

              await client.download_media(
                  message,
                  file="font_source"
              )

              await client.disconnect()

          asyncio.run(main())
          PYTHON

            python download_font.py
          fi

      - name: Prepare font
        run: |
          if [ -f "font_source" ]; then
            mkdir -p custom_fonts

            if file "font_source" | grep -qi "RAR"; then
              sudo apt-get update
              sudo apt-get install -y unrar
              unrar x -o+ "font_source" custom_fonts/
            else
              cp "font_source" custom_fonts/
            fi

            find custom_fonts -type f \
              \( -iname "*.ttf" -o -iname "*.otf" \) \
              | head -n 1 > selected_font.txt

            if [ ! -s selected_font.txt ]; then
              echo "❌ لم يتم العثور على TTF أو OTF داخل ملف الخط."
              exit 1
            fi

            FONT_PATH="$(cat selected_font.txt)"
            FONT_NAME="$(fc-scan --format='%{family}' "$FONT_PATH" | head -n 1)"

            if [ -z "$FONT_NAME" ]; then
              echo "❌ تعذر معرفة اسم عائلة الخط."
              exit 1
            fi

            mkdir -p "$HOME/.local/share/fonts"
            cp "$FONT_PATH" "$HOME/.local/share/fonts/"
            fc-cache -f "$HOME/.local/share/fonts"

            echo "FONT_FILE=$FONT_PATH" >> "$GITHUB_ENV"
            echo "FONT_NAME=$FONT_NAME" >> "$GITHUB_ENV"

            echo "✅ تم تجهيز الخط: $FONT_PATH"
            echo "🔤 اسم الخط: $FONT_NAME"

            echo "✅ تم تجهيز الخط: $FONT_PATH"
            echo "🔤 اسم الخط: $FONT_NAME"
          else
            echo "ℹ️ لا يوجد خط مخصص، سيتم استخدام الخط الافتراضي."
          fi

      - name: Prepare watermark
        run: |
          if [ -f "watermark_source" ]; then
            file "watermark_source" || true

            if file "watermark_source" | grep -qi "RAR"; then
              sudo apt-get update
              sudo apt-get install -y unrar
              mkdir -p watermark_extract
              unrar x -o+ "watermark_source" watermark_extract/

              find watermark_extract -type f \\
                \\( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \\) \\
                | head -n 1 | xargs -r -I{} cp "{}" watermark.png

            else
              cp "watermark_source" watermark.png
            fi

            if [ ! -f "watermark.png" ]; then
              echo "❌ لم يتم العثور على صورة داخل ملف العلامة المائية."
              exit 1
            fi

            echo "✅ تم تجهيز العلامة المائية: watermark.png"
          else
            echo "ℹ️ لا توجد علامة مائية مفعلة."
          fi

      - name: Set processing settings
        env:
          FONT_SIZE: ${{ inputs.font_size }}
          FONT_COLOR: ${{ inputs.font_color }}
          SUBTITLE_OUTLINE: ${{ inputs.subtitle_outline }}
          SUBTITLE_BOX: ${{ inputs.subtitle_box }}
          WATERMARK_POSITION: ${{ inputs.watermark_position }}
          WATERMARK_SIZE: ${{ inputs.watermark_size }}
          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}
        run: |
          echo "FONT_SIZE=$FONT_SIZE" >> "$GITHUB_ENV"
          echo "FONT_COLOR=$FONT_COLOR" >> "$GITHUB_ENV"
          echo "SUBTITLE_OUTLINE=$SUBTITLE_OUTLINE" >> "$GITHUB_ENV"
          echo "SUBTITLE_BOX=$SUBTITLE_BOX" >> "$GITHUB_ENV"
          echo "WATERMARK_POSITION=$WATERMARK_POSITION" >> "$GITHUB_ENV"
          echo "WATERMARK_SIZE=$WATERMARK_SIZE" >> "$GITHUB_ENV"
          echo "WATERMARK_ENABLED=$WATERMARK_ENABLED" >> "$GITHUB_ENV"

          echo "✅ تم تحميل إعدادات المعالجة"
          echo "حجم الخط: $FONT_SIZE"
          echo "لون الترجمة: $FONT_COLOR"
          echo "الحواف: $SUBTITLE_OUTLINE"
          echo "البوكس: $SUBTITLE_BOX"
          echo "العلامة: $WATERMARK_ENABLED"
          echo "موضع العلامة: $WATERMARK_POSITION"
          echo "حجم العلامة: $WATERMARK_SIZE%"

      - name: Set resolution
        run: |
          case "${{ inputs.resolution }}" in
            "same")
              echo "SCALE_FILTER=null" >> "$GITHUB_ENV"
              ;;
            "1080p")
              echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV"
              ;;
            "720p")
              echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV"
              ;;
            "480p")
              echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV"
              ;;
            "360p")
              echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Process video
        run: |
          FILTERS=""

          # -----------------------------
          # Subtitle
          # -----------------------------
          if [ -f "subtitle.ass" ] || [ -f "subtitle.ssa" ]; then
            SUBTITLE_FILE="subtitle.ass"

            if [ -f "subtitle.ssa" ]; then
              SUBTITLE_FILE="subtitle.ssa"
            fi

            echo "🎬 ASS/SSA detected - preserving original styles"

            FILTERS="subtitles=${SUBTITLE_FILE}"

          elif [ -f "subtitle.srt" ]; then
            echo "🎬 SRT detected"

            COLOR="&H00FFFFFF"

            case "$FONT_COLOR" in
              white)
                COLOR="&H00FFFFFF"
                ;;
              yellow)
                COLOR="&H0000FFFF"
                ;;
              cyan)
                COLOR="&H00FFFF00"
                ;;
              green)
                COLOR="&H0000FF00"
                ;;
              red)
                COLOR="&H000000FF"
                ;;
            esac

            if [ "$SUBTITLE_BOX" = "on" ]; then
              FORCE_STYLE="FontName=${FONT_NAME:-Noto Sans},FontSize=${FONT_SIZE},PrimaryColour=${COLOR},OutlineColour=&H00000000,Outline=0,Shadow=0,BorderStyle=3,BackColour=&H00000000,Alignment=2"
            else
              FORCE_STYLE="FontName=${FONT_NAME:-Noto Sans},FontSize=${FONT_SIZE},PrimaryColour=${COLOR},OutlineColour=&H00000000,Outline=${SUBTITLE_OUTLINE},Shadow=0,Alignment=2"
            fi

            FILTERS="subtitles=subtitle.srt:force_style='${FORCE_STYLE}'"
          fi

          # -----------------------------
          # Resolution
          # -----------------------------
          if [ -n "$FILTERS" ]; then
            if [ "$SCALE_FILTER" != "null" ]; then
              FILTERS="${FILTERS},${SCALE_FILTER}"
            fi
          else
            if [ "$SCALE_FILTER" != "null" ]; then
              FILTERS="${SCALE_FILTER}"
            fi
          fi

          # -----------------------------
          # Watermark
          # -----------------------------
          if [ "$WATERMARK_ENABLED" = "true" ] && [ -f "watermark.png" ]; then

            echo "🖼️ Adding watermark"

            WM_SCALE="scale=iw*${WATERMARK_SIZE}/100:-1"

            case "$WATERMARK_POSITION" in
              top_left)
                WM_OVERLAY="20:20"
                ;;
              top_right)
                WM_OVERLAY="main_w-overlay_w-20:20"
                ;;
              bottom_left)
                WM_OVERLAY="20:main_h-overlay_h-20"
                ;;
              bottom_right)
                WM_OVERLAY="main_w-overlay_w-20:main_h-overlay_h-20"
                ;;
              *)
                WM_OVERLAY="20:20"
                ;;
            esac

            if [ -n "$FILTERS" ]; then
              ffmpeg -y \
                -i input.mkv \
                -i watermark.png \
                -filter_complex "[0:v]${FILTERS}[v0];[1:v]${WM_SCALE}[wm];[v0][wm]overlay=${WM_OVERLAY}[v]" \
                -map "[v]" \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4
            else
              ffmpeg -y \
                -i input.mkv \
                -i watermark.png \
                -filter_complex "[1:v]${WM_SCALE}[wm];[0:v][wm]overlay=${WM_OVERLAY}[v]" \
                -map "[v]" \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4
            fi

          else

            echo "🎬 Processing without watermark"

            if [ -n "$FILTERS" ]; then
              ffmpeg -y \
                -i input.mkv \
                -vf "$FILTERS" \
                -map 0:v:0 \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4
            else
              ffmpeg -y \
                -i input.mkv \
                -vf "$FILTERS" \
                -map 0:v:0 \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4
            fi

          fi

      - name: Send result to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          python -m pip install "telethon<2" cryptg

          cat > send.py <<'PY'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              await client.send_file(
                  int(os.environ["CHAT_ID"]),
                  "output.mp4",
                  caption="🎬 تم تجهيز الفيلم بنجاح.",
                  video=True,
                  supports_streaming=True
              )

              await client.disconnect()

          asyncio.run(main())
          PY

          python send.py

      - name: Clean files
        if: always()
        run: |
          rm -f input.mkv subtitle.srt output.mp4 send.py
