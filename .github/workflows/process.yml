name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: true
        type: string

      subtitle_url:
        description: "Direct SRT URL"
        required: true
        type: string

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "720p"

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget fonts-noto-core

      - name: Download video
        run: |
          wget -O input.mkv "${{ inputs.video_url }}"

      - name: Download subtitle
        run: |
          wget -O subtitle.srt "${{ inputs.subtitle_url }}"

      - name: Set resolution
        run: |
          case "${{ inputs.resolution }}" in
            "1080p")
              echo "HEIGHT=1080" >> "$GITHUB_ENV"
              ;;
            "720p")
              echo "HEIGHT=720" >> "$GITHUB_ENV"
              ;;
            "480p")
              echo "HEIGHT=480" >> "$GITHUB_ENV"
              ;;
            "360p")
              echo "HEIGHT=360" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Burn subtitle and resize
        run: |
          ffmpeg -y \
            -i input.mkv \
            -vf "subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2',scale=-2:min(ih\,${HEIGHT})" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Send result to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python -m pip install "telethon<2" cryptg

          cat > send.py <<'PY'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              await client.send_file(
                  "me",
                  "output.mp4",
                  caption="تم تجهيز الفيلم وترجمة الـSRT."
              )

              await client.disconnect()

          asyncio.run(main())
          PY

          python send.py

      - name: Clean files
        run: |
          rm -f input.mkv subtitle.srt output.mp4 send.py
