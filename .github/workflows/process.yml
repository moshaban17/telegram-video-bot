name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: false
        type: string
        default: ""

      subtitle_url:
        description: "Direct SRT/ASS subtitle URL"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "same"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      bot_username:
        description: "Telegram bot username"
        required: false
        type: string
        default: "CinmalekHardsubBot"

      srt_file_id:
        description: "Telegram subtitle file ID"
        required: false
        type: string
        default: ""

      telegram_message_id:
        description: "Telegram media message ID"
        required: false
        type: string
        default: ""

      source_type:
        description: "Video source"
        required: false
        type: choice
        options:
          - "url"
          - "telegram"
        default: "url"

      operation:
        description: "Operation"
        required: false
        type: choice
        options:
          - "video"
          - "subtitle"
          - "translate_srt"
          - "video_ocr"
          - "audio_srt"
        default: "video"

      subtitle_type:
        description: "Subtitle type"
        required: false
        type: choice
        options:
          - "srt"
          - "ass"
        default: "srt"

      font_name:
        description: "SRT font"
        required: false
        type: string
        default: "Noto Sans"

      font_size:
        description: "SRT font size"
        required: false
        type: string
        default: "28"

      font_color:
        description: "SRT font color"
        required: false
        type: string
        default: "white"

      subtitle_box:
        description: "SRT black box"
        required: false
        type: string
        default: "off"


jobs:

  process:
    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # SRT TRANSLATION
      # ============================================================

      - name: Install Python packages for SRT translation
        if: ${{ inputs.operation == 'translate_srt' }}
        run: |
          python -m pip install --upgrade pip
          pip install -U requests


      - name: Download SRT from Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SRT_FILE_ID: ${{ inputs.srt_file_id }}
        run: |

          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          file_id = os.environ["SRT_FILE_ID"]

          if not file_id:
              raise RuntimeError("SRT_FILE_ID is empty.")

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getFile",
              params={"file_id": file_id},
              timeout=30
          )

          r.raise_for_status()

          data = r.json()

          if not data.get("ok"):
              raise RuntimeError(data)

          file_path = data["result"]["file_path"]

          download_url = (
              f"https://api.telegram.org/file/bot"
              f"{token}/{file_path}"
          )

          r = requests.get(
              download_url,
              timeout=120
          )

          r.raise_for_status()

          with open("input.srt", "wb") as f:
              f.write(r.content)

          print("SRT downloaded successfully.")
          PY


      # ============================================================
      # OPENROUTER SRT TRANSLATION
      # ============================================================

      - name: Translate SRT with OpenRouter
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |

          cat > translate_srt.py <<'PY'
          import os
          import re
          import time
          import random
          import requests


          INPUT_FILE = "input.srt"
          OUTPUT_FILE = "arabic.srt"

          API_URL = "https://openrouter.ai/api/v1/chat/completions"

          PRIMARY_MODEL = "openrouter/free"
          FALLBACK_MODEL = "google/gemma-4-31b-it:free"

          BATCH_SIZE = 60
          CONTEXT_LINES = 10

          MIN_SPLIT_SIZE = 15

          MAX_RETRIES_PER_MODEL = 3


          PROMPT = r"""
          أنت مترجم محترف لترجمة الأفلام والمسلسلات إلى العربية الفصحى الحديثة.

          مهمتك ترجمة نصوص SRT إلى عربية فصحى طبيعية وسينمائية.

          القواعد الصارمة:

          1. افهم السياق قبل الترجمة.
          2. ترجم المعنى المقصود بدقة وبأسلوب عربي فصيح طبيعي.
          3. لا تترجم التعبيرات الاصطلاحية حرفيًا إذا أدى ذلك إلى معنى غريب.
          4. راعِ جنس المتحدث والمخاطَب.
          5. حافظ على أسماء الشخصيات والأماكن والمصطلحات.
          6. حافظ على مستوى الشتائم والإهانات الموجود في الأصل.
          7. لا تحذف أي حوار.
          8. لا تضف أي حوار.
          9. لا تغير أرقام المقاطع.
          10. لا تغير التوقيتات.
          11. لا تغير ترتيب المقاطع.
          12. لا تغير عدد المقاطع.
          13. حافظ على جميع HTML/style tags كما هي تمامًا.
          14. إذا وجدت:
              <font color="...">
              <i>
              </i>
              </font>
              أو أي tags مشابهة، اترك الكود كما هو وترجم النص داخله فقط.
          15. حافظ على رموز ♪ و ♫ كما هي.
          16. إذا تكرر سطر أغنية في المصدر، يجب أن يتكرر في الترجمة.
          17. استخدم العربية الفصحى وليس العامية.
          18. استخدم "إله" حسب السياق بدل استبداله تلقائيًا بـ"الله".
          19. "hey man" = "يا رجل" حسب السياق.
          20. "hey + name" = "يا [الاسم]".
          21. "wow" = "يا للروعة" حسب السياق.
          22. استخدم "أيها" و"أيتها" عندما يكون ذلك مناسبًا للسياق.
          23. لا تخلط بين المذكر والمؤنث.
          24. لا تضف شرحًا أو ملاحظات.
          25. أعد SRT فقط.
          26. غيّر نص الحوار فقط.
          27. يجب أن يكون كل مقطع مترجمًا مقابل المقطع الأصلي نفسه.
          28. يجب أن يبقى رقم المقطع والتوقيت كما هما حرفيًا.

          مهم جدًا بخصوص السياق:

          - سيتم تزويدك بمقاطع سابقة ولاحقة للمقاطع المطلوب ترجمتها.
          - مقاطع السياق موجودة للفهم فقط ولا يجب ترجمتها أو وضعها في الناتج.
          - استخدم الحوار السابق واللاحق لمعرفة من يتحدث مع من.
          - إذا كان جنس المخاطَب واضحًا من السياق، حافظ عليه.
          - حافظ على اتساق جنس المخاطَب عبر المشهد.
          - لا تعتبر كل سطر منفصلًا عن الحوار المحيط به.

          الناتج يجب أن يكون SRT فقط، دون Markdown أو شرح.
          """


          def parse_srt(text):
              text = text.replace("\r\n", "\n")
              text = text.replace("\r", "\n")

              blocks = re.split(
                  r"\n\s*\n",
                  text.strip()
              )

              result = []

              for block in blocks:
                  lines = block.split("\n")

                  if len(lines) < 3:
                      continue

                  number = lines[0].strip()
                  timing = lines[1].strip()

                  if not number:
                      continue

                  if "-->" not in timing:
                      continue

                  result.append({
                      "number": number,
                      "timing": timing,
                      "text": "\n".join(lines[2:])
                  })

              return result


          def build_srt(blocks):
              output = []

              for block in blocks:
                  output.append(block["number"])
                  output.append(block["timing"])
                  output.append(block["text"])
                  output.append("")

              return "\n".join(output)


          def extract_answer(text):
              text = text.strip()

              text = re.sub(
                  r"<think>.*?</think>",
                  "",
                  text,
                  flags=re.DOTALL | re.IGNORECASE
              )

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines)

              return text.strip()


          def get_error_status(response):
              try:
                  data = response.json()
              except Exception:
                  data = {}

              error = data.get("error", {})

              if isinstance(error, dict):
                  return (
                      error.get(
                          "code",
                          response.status_code
                      ),
                      error.get(
                          "message",
                          response.text
                      )
                  )

              return (
                  response.status_code,
                  response.text
              )


          def call_openrouter(model, prompt):
              api_key = os.environ.get(
                  "OPENROUTER_API_KEY",
                  ""
              ).strip()

              if not api_key:
                  raise RuntimeError(
                      "OPENROUTER_API_KEY is missing."
                  )

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/moshaban17/telegram-video-bot",
                  "X-Title": "Telegram Video Bot SRT Translator"
              }

              payload = {
                  "model": model,
                  "messages": [
                      {
                          "role": "system",
                          "content": PROMPT
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.1,
                  "max_tokens": 12000
              }

              last_error = None

              for attempt in range(
                  1,
                  MAX_RETRIES_PER_MODEL + 1
              ):

                  try:
                      print(
                          f"🤖 Model: {model} | "
                          f"Attempt {attempt}/"
                          f"{MAX_RETRIES_PER_MODEL}"
                      )

                      response = requests.post(
                          API_URL,
                          headers=headers,
                          json=payload,
                          timeout=300
                      )

                      if response.status_code == 200:
                          data = response.json()

                          choices = data.get(
                              "choices",
                              []
                          )

                          if not choices:
                              raise RuntimeError(
                                  "OpenRouter returned no choices."
                              )

                          message = choices[0].get(
                              "message",
                              {}
                          )

                          content = message.get(
                              "content"
                          )

                          if isinstance(
                              content,
                              list
                          ):
                              content = "".join(
                                  item.get("text", "")
                                  for item in content
                                  if isinstance(item, dict)
                              )

                          if not content:
                              raise RuntimeError(
                                  "OpenRouter returned empty content."
                              )

                          return content

                      code, message = get_error_status(
                          response
                      )

                      last_error = RuntimeError(
                          f"HTTP {code}: {message}"
                      )

                      print(
                          f"⚠️ OpenRouter error: "
                          f"{last_error}"
                      )

                      retryable = (
                          response.status_code in (
                              408,
                              429,
                              500,
                              502,
                              503,
                              504
                          )
                      )

                      if not retryable:
                          raise last_error

                      if attempt >= MAX_RETRIES_PER_MODEL:
                          break

                      wait_seconds = min(
                          60,
                          5 * (2 ** (attempt - 1))
                      )

                      retry_after = response.headers.get(
                          "Retry-After"
                      )

                      if retry_after:
                          try:
                              wait_seconds = min(
                                  120,
                                  float(retry_after)
                              )
                          except Exception:
                              pass

                      wait_seconds += random.uniform(
                          0,
                          3
                      )

                      print(
                          f"⏳ Waiting "
                          f"{wait_seconds:.1f} seconds..."
                      )

                      time.sleep(
                          wait_seconds
                      )

                  except requests.RequestException as exc:
                      last_error = exc

                      print(
                          f"⚠️ Network error: {exc}"
                      )

                      if attempt >= MAX_RETRIES_PER_MODEL:
                          break

                      wait_seconds = min(
                          60,
                          5 * (2 ** (attempt - 1))
                      )

                      time.sleep(
                          wait_seconds
                          + random.uniform(0, 3)
                      )

              raise last_error


          def validate_translation(
              original,
              translated
          ):
              if len(translated) != len(original):
                  raise RuntimeError(
                      f"Expected {len(original)} "
                      f"subtitles but received "
                      f"{len(translated)}"
                  )

              for old, new in zip(
                  original,
                  translated
              ):

                  if old["number"] != new["number"]:
                      raise RuntimeError(
                          "Subtitle numbering changed."
                      )

                  if old["timing"] != new["timing"]:
                      raise RuntimeError(
                          "Subtitle timing changed."
                      )

                  if not new["text"].strip():
                      raise RuntimeError(
                          "Translated subtitle is empty."
                      )

                  for symbol in ("♪", "♫"):
                      if (
                          old["text"].count(symbol)
                          != new["text"].count(symbol)
                      ):
                          raise RuntimeError(
                              f"Music symbol {symbol} "
                              f"was changed."
                          )

                  old_tags = re.findall(
                      r"<[^>]+>",
                      old["text"]
                  )

                  new_tags = re.findall(
                      r"<[^>]+>",
                      new["text"]
                  )

                  if old_tags != new_tags:
                      raise RuntimeError(
                          "HTML/style tags were changed."
                      )


          def build_context(
              all_subtitles,
              start_index,
              batch_length
          ):
              context_start = max(
                  0,
                  start_index - CONTEXT_LINES
              )

              context_end = min(
                  len(all_subtitles),
                  start_index
                  + batch_length
                  + CONTEXT_LINES
              )

              context_blocks = []

              for index in range(
                  context_start,
                  context_end
              ):

                  if (
                      start_index
                      <= index
                      < start_index + batch_length
                  ):
                      continue

                  item = all_subtitles[index]

                  context_blocks.append(
                      item["number"]
                      + "\n"
                      + item["timing"]
                      + "\n"
                      + item["text"]
                  )

              if not context_blocks:
                  return "(لا يوجد سياق إضافي.)"

              return "\n\n".join(
                  context_blocks
              )


          def translate_once(
              batch,
              model,
              all_subtitles,
              start_index
          ):
              source = build_srt(batch)

              context = build_context(
                  all_subtitles,
                  start_index,
                  len(batch)
              )

              prompt = (
                  "السياق المحيط التالي للفهم فقط. "
                  "لا تترجمه ولا تضعه في الناتج:\n\n"
                  "================ CONTEXT ================\n"
                  + context
                  + "\n\n"
                  "================ TRANSLATE ONLY ================\n"
                  + source
                  + "\n\n"
                  "أعد المقاطع الموجودة تحت TRANSLATE ONLY فقط."
              )

              response_text = call_openrouter(
                  model,
                  prompt
              )

              translated = parse_srt(
                  extract_answer(
                      response_text
                  )
              )

              validate_translation(
                  batch,
                  translated
              )

              return translated


          def translate_batch(
              batch,
              all_subtitles,
              start_index
          ):
              print(
                  f"📦 Batch size: {len(batch)}"
              )

              try:
                  translated = translate_once(
                      batch,
                      PRIMARY_MODEL,
                      all_subtitles,
                      start_index
                  )

                  print(
                      f"✅ Success: {PRIMARY_MODEL}"
                  )

                  return translated

              except Exception as primary_error:
                  print(
                      "⚠️ Primary model failed:"
                  )

                  print(
                      primary_error
                  )

              try:
                  print(
                      f"🔄 Trying fallback: "
                      f"{FALLBACK_MODEL}"
                  )

                  translated = translate_once(
                      batch,
                      FALLBACK_MODEL,
                      all_subtitles,
                      start_index
                  )

                  print(
                      f"✅ Success: {FALLBACK_MODEL}"
                  )

                  return translated

              except Exception as fallback_error:
                  print(
                      "⚠️ Fallback model failed:"
                  )

                  print(
                      fallback_error
                  )

              if len(batch) <= MIN_SPLIT_SIZE:
                  raise RuntimeError(
                      f"Both free models failed "
                      f"for batch of {len(batch)} subtitles."
                  )

              midpoint = len(batch) // 2

              left_batch = batch[:midpoint]
              right_batch = batch[midpoint:]

              print(
                  f"🔀 Splitting failed batch "
                  f"{len(batch)} -> "
                  f"{len(left_batch)} + "
                  f"{len(right_batch)}"
              )

              left_result = translate_batch(
                  left_batch,
                  all_subtitles,
                  start_index
              )

              right_result = translate_batch(
                  right_batch,
                  all_subtitles,
                  start_index + len(left_batch)
              )

              return (
                  left_result
                  + right_result
              )


          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig"
          ) as f:
              text = f.read()

          subtitles = parse_srt(text)

          if not subtitles:
              raise RuntimeError(
                  "No valid subtitles found."
              )

          print(
              f"📄 Total subtitles: "
              f"{len(subtitles)}"
          )

          if not os.environ.get(
              "OPENROUTER_API_KEY",
              ""
          ).strip():
              raise RuntimeError(
                  "OPENROUTER_API_KEY secret is missing."
              )

          translated_all = []

          for start in range(
              0,
              len(subtitles),
              BATCH_SIZE
          ):

              end = min(
                  start + BATCH_SIZE,
                  len(subtitles)
              )

              print("")
              print(
                  "========================================"
              )

              print(
                  f"🌐 Translating subtitles "
                  f"{start + 1}-{end} "
                  f"of {len(subtitles)}"
              )

              print(
                  "========================================"
              )

              batch = subtitles[
                  start:end
              ]

              translated_batch = translate_batch(
                  batch,
                  subtitles,
                  start
              )

              validate_translation(
                  batch,
                  translated_batch
              )

              translated_all.extend(
                  translated_batch
              )

              with open(
                  OUTPUT_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      build_srt(
                          translated_all
                      )
                  )

              print(
                  f"💾 Progress saved: "
                  f"{len(translated_all)}/"
                  f"{len(subtitles)}"
              )

              if end < len(subtitles):
                  time.sleep(3)

          validate_translation(
              subtitles,
              translated_all
          )

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  build_srt(
                      translated_all
                  )
              )

          print("")
          print(
              "========================================"
          )

          print(
              f"✅ Translation completed: "
              f"{len(translated_all)} subtitles"
          )

          print(
              f"📄 Output: {OUTPUT_FILE}"
          )

          print(
              "========================================"
          )
          PY

          python translate_srt.py


      - name: Send translated SRT to Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@arabic.srt" \
            -F "caption=🇸🇦 تمت ترجمة ملف SRT إلى العربية الفصحى بنجاح."


      # ============================================================
      # TELEGRAM / VIDEO TOOLS
      # ============================================================

      - name: Install Telegram library
        if: ${{ inputs.operation == 'video' || inputs.operation == 'subtitle' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt' }}
        run: |
          python -m pip install "telethon<2" cryptg


      - name: Install audio transcription tools
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2

          python -m pip install --upgrade pip

          pip install faster-whisper


      - name: Install video tools
        if: ${{ inputs.operation == 'video' || inputs.operation == 'subtitle' || inputs.operation == 'video_ocr' }}
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2


      # ============================================================
      # TELEGRAM MEDIA INPUT
      # ============================================================

      - name: Download media from Telegram
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'subtitle' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt') && inputs.source_type == 'telegram' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: ${{ inputs.bot_username }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          OPERATION: ${{ inputs.operation }}
        run: |

          cat > download_telegram.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          VIDEO_EXTENSIONS = (
              ".mp4",
              ".mkv",
              ".avi",
              ".mov",
              ".webm",
              ".m4v",
              ".ts"
          )

          AUDIO_EXTENSIONS = (
              ".mp3",
              ".wav",
              ".m4a",
              ".aac",
              ".ogg",
              ".opus",
              ".flac",
              ".amr",
              ".wma"
          )


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              user_id = int(
                  os.environ["CHAT_ID"]
              )

              me = await client.get_me()

              if me.id != user_id:
                  raise RuntimeError(
                      "Telegram session account does not match CHAT_ID."
                  )

              bot_username = (
                  os.environ["BOT_USERNAME"]
                  .strip()
                  .lstrip("@")
              )

              operation = os.environ[
                  "OPERATION"
              ]

              message_id = (
                  os.environ.get(
                      "TELEGRAM_MESSAGE_ID",
                      ""
                  ).strip()
              )

              entity = await client.get_entity(
                  f"@{bot_username}"
              )

              found = None

              if message_id:

                  print(
                      f"🔎 Searching exact message "
                      f"{message_id}..."
                  )

                  item = await client.get_messages(
                      entity,
                      ids=int(message_id)
                  )

                  if item:

                      if item.media and item.file:

                          mime = (
                              getattr(
                                  item.file,
                                  "mime_type",
                                  ""
                              )
                              or ""
                          )

                          name = (
                              getattr(
                                  item.file,
                                  "name",
                                  ""
                              )
                              or ""
                          ).lower()

                          is_video = (
                              mime.startswith("video/")
                              or name.endswith(
                                  VIDEO_EXTENSIONS
                              )
                          )

                          is_audio = (
                              mime.startswith("audio/")
                              or name.endswith(
                                  AUDIO_EXTENSIONS
                              )
                          )

                          if operation == "audio_srt":

                              if (
                                  is_video
                                  or is_audio
                              ):
                                  found = item

                          elif is_video:
                              found = item

              if not found:

                  print(
                      "🔎 Searching last 200 messages..."
                  )

                  async for item in client.iter_messages(
                      entity,
                      limit=200,
                      from_user=user_id
                  ):

                      if not item.media:
                          continue

                      if not item.file:
                          continue

                      mime = (
                          getattr(
                              item.file,
                              "mime_type",
                              ""
                          )
                          or ""
                      )

                      name = (
                          getattr(
                              item.file,
                              "name",
                              ""
                          )
                          or ""
                      ).lower()

                      is_video = (
                          mime.startswith("video/")
                          or name.endswith(
                              VIDEO_EXTENSIONS
                          )
                      )

                      is_audio = (
                          mime.startswith("audio/")
                          or name.endswith(
                              AUDIO_EXTENSIONS
                          )
                      )

                      if operation == "audio_srt":

                          if not (
                              is_video
                              or is_audio
                          ):
                              continue

                      elif not is_video:
                          continue

                      found = item
                      break

              if not found:
                  raise RuntimeError(
                      "No suitable Telegram media found."
                  )

              print(
                  f"✅ Found Telegram message "
                  f"{found.id}"
              )

              path = await found.download_media(
                  file="input.mkv"
              )

              if not path:
                  raise RuntimeError(
                      "Telegram download failed."
                  )

              print(
                  f"✅ Downloaded: {path}"
              )

              print(
                  f"📦 Size: "
                  f"{os.path.getsize(path) / 1024 / 1024:.2f} MB"
              )

              await client.disconnect()


          asyncio.run(main())
          PY

