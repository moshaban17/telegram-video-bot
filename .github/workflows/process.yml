name: Video Processor

"on":
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      video_message_id:
        description: "Telegram video message ID"
        required: true
        type: string

      subtitle_message_id:
        description: "Telegram subtitle message ID"
        required: true
        type: string

      subtitle_type:
        description: "Subtitle type"
        required: true
        type: choice
        options:
          - srt
          - ass
          - ssa
        default: srt

      font_message_id:
        description: "Telegram font message ID"
        required: false
        type: string
        default: ""

      font_size:
        description: "Subtitle font size"
        required: false
        type: string
        default: "26"
        
      font_color:
        description: "Subtitle font color"
        required: false
        type: string
        default: "white"

      subtitle_outline:
        description: "Subtitle outline"
        required: false
        type: string
        default: "0.5"

      subtitle_box:
        description: "Subtitle Box"
        required: false
        type: choice
        options:
          - "off"
          - "on"
        default: "off"

      watermark_message_id:
        description: "Telegram watermark message ID"
        required: false
        type: string
        default: ""

      watermark_enabled:
        description: "Enable watermark"
        required: false
        type: boolean
        default: false

      watermark_position:
        description: "Watermark position"
        required: false
        type: choice
        options:
          - top_left
          - top_right
          - bottom_left
          - bottom_right
          - center
        default: top_left

      watermark_size:
        description: "Watermark width percentage"
        required: false
        type: string
        default: "20"

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      CHAT_ID: ${{ inputs.chat_id }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fontconfig \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-extra \
            unrar \
            file

          python -m pip install --upgrade pip
          pip install "telethon>=1.45,<2" cryptg

      - name: Validate secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          set -e

          test -n "$API_ID" || {
            echo "API_ID is missing"
            exit 1
          }

          test -n "$API_HASH" || {
            echo "API_HASH is missing"
            exit 1
          }

          test -n "$BOT_TOKEN" || {
            echo "BOT_TOKEN is missing"
            exit 1
          }

          test -n "$TG_SESSION" || {
            echo "TG_SESSION is missing"
            exit 1
          }

      - name: Download Telegram files
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

          VIDEO_MESSAGE_ID: ${{ inputs.video_message_id }}
          SUBTITLE_MESSAGE_ID: ${{ inputs.subtitle_message_id }}
          FONT_MESSAGE_ID: ${{ inputs.font_message_id }}
          WATERMARK_MESSAGE_ID: ${{ inputs.watermark_message_id }}

        run: |
          cat > download_files.py <<'PY'
          import os
          import asyncio
          from pathlib import Path
          from telethon import TelegramClient

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          TG_SESSION = os.environ["TG_SESSION"]
          BOT_TOKEN = os.environ["BOT_TOKEN"]

          CHAT_ID = int(os.environ["CHAT_ID"])
          VIDEO_MESSAGE_ID = int(os.environ["VIDEO_MESSAGE_ID"])
          SUBTITLE_MESSAGE_ID = int(os.environ["SUBTITLE_MESSAGE_ID"])
          FONT_MESSAGE_ID = os.environ.get("FONT_MESSAGE_ID", "").strip()
          WATERMARK_MESSAGE_ID = os.environ.get("WATERMARK_MESSAGE_ID", "").strip()

          client = TelegramClient(
              "worker",
              API_ID,
              API_HASH,
              device_model="GitHub Actions",
              system_version="Linux",
              app_version="1.0"
          )

          async def get_message(message_id):
              message = await client.get_messages(
                  CHAT_ID,
                  ids=message_id
              )

              if not message:
                  raise RuntimeError(
                      f"Message {message_id} was not found in chat {CHAT_ID}."
                  )

              return message

          async def main():
              await client.start(bot_token=BOT_TOKEN)

              video_msg = await get_message(VIDEO_MESSAGE_ID)
              subtitle_msg = await get_message(SUBTITLE_MESSAGE_ID)

              if not video_msg.media:
                  raise RuntimeError(
                      f"Video message {VIDEO_MESSAGE_ID} has no media."
                  )

              if not subtitle_msg.media:
                  raise RuntimeError(
                      f"Subtitle message {SUBTITLE_MESSAGE_ID} has no media."
                  )

              video_path = await client.download_media(
                  video_msg,
                  file="input_video"
              )

              subtitle_path = await client.download_media(
                  subtitle_msg,
                  file="subtitle_source"
              )

              if not video_path:
                  raise RuntimeError("Failed to download video.")

              if not subtitle_path:
                  raise RuntimeError("Failed to download subtitle.")

              print("VIDEO_PATH:", video_path)
              print("SUBTITLE_PATH:", subtitle_path)

              Path("video_path.txt").write_text(
                  str(Path(video_path).resolve()),
                  encoding="utf-8"
              )

              Path("subtitle_path.txt").write_text(
                  str(Path(subtitle_path).resolve()),
                  encoding="utf-8"
              )

              if FONT_MESSAGE_ID:
                  font_msg = await get_message(int(FONT_MESSAGE_ID))

                  if font_msg.media:
                      font_path = await client.download_media(
                          font_msg,
                          file="font_source"
                      )

                      if font_path:
                          print("FONT_PATH:", font_path)
                          Path("font_path.txt").write_text(
                              str(Path(font_path).resolve()),
                              encoding="utf-8"
                          )

              if WATERMARK_MESSAGE_ID:
                  watermark_msg = await get_message(
                      int(WATERMARK_MESSAGE_ID)
                  )

                  if watermark_msg.media:
                      watermark_path = await client.download_media(
                          watermark_msg,
                          file="watermark_source"
                      )

                      if watermark_path:
                          print("WATERMARK_PATH:", watermark_path)
                          Path("watermark_path.txt").write_text(
                              str(Path(watermark_path).resolve()),
                              encoding="utf-8"
                          )

              await client.disconnect()

          asyncio.run(main())
          PY

          python download_files.py

      - name: Prepare subtitle and font
        env:
          SUBTITLE_TYPE: ${{ inputs.subtitle_type }}
        run: |
          set -e

          SUBTITLE_PATH="$(cat subtitle_path.txt)"

          case "$SUBTITLE_TYPE" in
            srt)
              cp "$SUBTITLE_PATH" subtitle.srt
              ;;
            ass)
              cp "$SUBTITLE_PATH" subtitle.ass
              ;;
            ssa)
              cp "$SUBTITLE_PATH" subtitle.ssa
              ;;
            *)
              echo "Unsupported subtitle type: $SUBTITLE_TYPE"
              exit 1
              ;;
          esac

          mkdir -p fonts

          if [ -f font_path.txt ]; then
            FONT_PATH="$(cat font_path.txt)"

            if file "$FONT_PATH" | grep -qiE 'TrueType|OpenType'; then
              cp "$FONT_PATH" "fonts/$(basename "$FONT_PATH")"

            elif file "$FONT_PATH" | grep -qiE 'RAR archive'; then
              mkdir -p font_extract
              unrar x -o+ "$FONT_PATH" font_extract/ >/dev/null

              find font_extract -type f \
                \( -iname "*.ttf" -o -iname "*.otf" \) \
                -exec cp {} fonts/ \;

            else
              echo "Unsupported font file."
              exit 1
            fi
          fi

      - name: Prepare watermark
        if: ${{ inputs.watermark_enabled }}
        run: |
          set -e

          test -f watermark_path.txt || {
            echo "Watermark is enabled but no watermark file was supplied."
            exit 1
          }

          WATERMARK_PATH="$(cat watermark_path.txt)"

          rm -rf watermark_extract
          mkdir -p watermark_extract

          if file "$WATERMARK_PATH" | grep -qiE 'RAR archive'; then

            unrar x -o+ "$WATERMARK_PATH" watermark_extract/ >/dev/null

            WM_FILE="$(find watermark_extract -type f \
              \( \
                -iname "*.png" \
                -o -iname "*.jpg" \
                -o -iname "*.jpeg" \
                -o -iname "*.webp" \
              \) | head -n 1)"

            test -n "$WM_FILE" || {
              echo "No supported image was found inside watermark archive."
              exit 1
            }

            cp "$WM_FILE" watermark.png

          else
            cp "$WATERMARK_PATH" watermark.png
          fi

          file watermark.png

      - name: Detect video information
        run: |
          set -e

          VIDEO_PATH="$(cat video_path.txt)"

          test -f "$VIDEO_PATH" || {
            echo "Video file not found:"
            echo "$VIDEO_PATH"
            exit 1
          }

          VIDEO_WIDTH="$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$VIDEO_PATH")"

          VIDEO_HEIGHT="$(ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$VIDEO_PATH")"

          VIDEO_DURATION="$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO_PATH")"

          echo "VIDEO_WIDTH=$VIDEO_WIDTH" >> "$GITHUB_ENV"
          echo "VIDEO_HEIGHT=$VIDEO_HEIGHT" >> "$GITHUB_ENV"
          echo "VIDEO_DURATION=$VIDEO_DURATION" >> "$GITHUB_ENV"

          echo "Video: ${VIDEO_WIDTH}x${VIDEO_HEIGHT}"
          echo "Duration: ${VIDEO_DURATION}"

      - name: Process video
        env:
          SUBTITLE_TYPE: ${{ inputs.subtitle_type }}
          FONT_SIZE: ${{ inputs.font_size }}
          FONT_COLOR: ${{ inputs.font_color }}
          SUBTITLE_OUTLINE: ${{ inputs.subtitle_outline }}
          SUBTITLE_BOX: ${{ inputs.subtitle_box }}

          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}
          WATERMARK_POSITION: ${{ inputs.watermark_position }}
          WATERMARK_SIZE: ${{ inputs.watermark_size }}

        run: |
          set -e

          VIDEO_PATH="$(cat video_path.txt)"

          case "$FONT_COLOR" in
            white)
              PRIMARY="&H00FFFFFF"
              ;;
            yellow)
              PRIMARY="&H0000FFFF"
              ;;
            red)
              PRIMARY="&H000000FF"
              ;;
            green)
              PRIMARY="&H0000FF00"
              ;;
            blue)
              PRIMARY="&H00FF0000"
              ;;
            cyan)
              PRIMARY="&H00FFFF00"
              ;;
            magenta)
              PRIMARY="&H00FF00FF"
              ;;
            black)
              PRIMARY="&H00000000"
              ;;
            *)
              PRIMARY="&H00FFFFFF"
              ;;
          esac

          BORDER_STYLE="1"

          if [ "$SUBTITLE_BOX" = "on" ]; then
            BORDER_STYLE="3"
          fi

          FONT_NAME="Noto Sans Arabic"

          if [ -d fonts ]; then
            CUSTOM_FONT="$(find fonts -type f \
              \( -iname "*.ttf" -o -iname "*.otf" \) | head -n 1 || true)"

            if [ -n "$CUSTOM_FONT" ]; then
              DETECTED_FONT="$(fc-scan \
                --format='%{family}' \
                "$CUSTOM_FONT" 2>/dev/null || true)"

              if [ -n "$DETECTED_FONT" ]; then
                FONT_NAME="$DETECTED_FONT"
              fi
            fi
          fi

          echo "Font: $FONT_NAME"
          echo "Font size: $FONT_SIZE"
          echo "Outline: $SUBTITLE_OUTLINE"
          echo "Box: $SUBTITLE_BOX"

          FORCE_STYLE="FontName=$FONT_NAME,FontSize=$FONT_SIZE,PrimaryColour=$PRIMARY,OutlineColour=&H00000000,BorderStyle=$BORDER_STYLE,Outline=$SUBTITLE_OUTLINE,Shadow=0,Alignment=2,MarginV=28"

          case "$SUBTITLE_TYPE" in
            srt)
              SUB_FILTER="subtitles=subtitle.srt:fontsdir=fonts:force_style='$FORCE_STYLE'"
              ;;
            ass)
              SUB_FILTER="ass=subtitle.ass:fontsdir=fonts"
              ;;
            ssa)
              SUB_FILTER="ass=subtitle.ssa:fontsdir=fonts"
              ;;
            *)
              echo "Invalid subtitle type."
              exit 1
              ;;
          esac

          if [ "$WATERMARK_ENABLED" = "true" ]; then

            test -f watermark.png || {
              echo "watermark.png was not found."
              exit 1
            }

            SIZE="${WATERMARK_SIZE:-20}"

            case "$WATERMARK_POSITION" in
              top_left)
                OX=20
                OY=20
                ;;
              top_right)
                OX="main_w-overlay_w-20"
                OY=20
                ;;
              bottom_left)
                OX=20
                OY="main_h-overlay_h-20"
                ;;
              bottom_right)
                OX="main_w-overlay_w-20"
                OY="main_h-overlay_h-20"
                ;;
              center)
                OX="(main_w-overlay_w)/2"
                OY="(main_h-overlay_h)/2"
                ;;
              *)
                OX=20
                OY=20
                ;;
            esac

            echo "Preparing watermark..."
            echo "Watermark size: ${SIZE}%"

            WM_WIDTH=$((VIDEO_WIDTH * SIZE / 100))

            if [ "$WM_WIDTH" -lt 1 ]; then
              WM_WIDTH=1
            fi

            echo "Watermark width: $WM_WIDTH"

            ffmpeg -y \
              -i watermark.png \
              -vf "scale=${WM_WIDTH}:-1" \
              -frames:v 1 \
              watermark_scaled.png

            FILTER="[0:v]$SUB_FILTER[subbed];[1:v]format=rgba[wm];[subbed][wm]overlay=${OX}:${OY}:format=auto[vout]"

            ffmpeg -y \
              -i "$VIDEO_PATH" \
              -loop 1 \
              -i watermark_scaled.png \
              -filter_complex "$FILTER" \
              -map "[vout]" \
              -map 0:a? \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              -shortest \
              output.mp4

          else

            FILTER="[0:v]$SUB_FILTER[vout]"

            ffmpeg -y \
              -i "$VIDEO_PATH" \
              -filter_complex "$FILTER" \
              -map "[vout]" \
              -map 0:a? \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              output.mp4

          fi

          test -s output.mp4 || {
            echo "output.mp4 was not created."
            exit 1
          }

          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output.mp4

      - name: Send result to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}

        run: |
          cat > send_result.py <<'PY'
          import os
          import asyncio
          from telethon import TelegramClient

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          TG_SESSION = os.environ["TG_SESSION"]
          CHAT_ID = int(os.environ["CHAT_ID"])

          async def main():
              client = TelegramClient(
                  "sender",
                  API_ID,
                  API_HASH,
                  device_model="GitHub Actions",
                  system_version="Linux",
                  app_version="1.0"
              )

              await client.start(
                  bot_token=os.environ.get("BOT_TOKEN")
              )

              await client.send_file(
                  CHAT_ID,
                  "output.mp4",
                  caption="🎬 تم حرق الترجمة بنجاح.",
                  video=True,
                  supports_streaming=True,
                  force_document=False
              )

              await client.disconnect()

          asyncio.run(main())
          PY

          BOT_TOKEN="${{ secrets.BOT_TOKEN }}" python send_result.py

      - name: Cleanup
        if: always()
        run: |
          rm -rf \
            input_video* \
            subtitle_source* \
            font_source* \
            watermark_source* \
            subtitle.srt \
            subtitle.ass \
            subtitle.ssa \
            fonts \
            font_extract \
            watermark_extract \
            watermark.png \
            watermark_scaled.png \
            output.mp4 \
            video_path.txt \
            subtitle_path.txt \
            font_path.txt \
            watermark_path.txt \
            download_files.py \
            send_result.py
