      # ============================================================
      # DOWNLOAD FONT
      # ============================================================

      - name: Download font
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_USERNAME: "@CinmalekHardsubBot"
          FONT_MESSAGE_DATE: ${{ inputs.font_message_date }}
        run: |
          if [ -n "$FONT_MESSAGE_DATE" ]; then
            echo "🔤 Downloading custom font..."

