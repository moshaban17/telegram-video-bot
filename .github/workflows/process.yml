      # ============================================================
      # PREPARE FONT
      # ============================================================

      - name: Prepare font
        run: |
          if [ -f "font_source" ]; then

            mkdir -p custom_fonts

            if file font_source | grep -qi "RAR"; then
              unrar x -o+ font_source custom_fonts/
            else
              cp font_source custom_fonts/
            fi

            find custom_fonts -type f \
              \( -iname "*.ttf" -o -iname "*.otf" \) \
              | head -n 1 > selected_font.txt

            if [ ! -s selected_font.txt ]; then
              echo "❌ لم يتم العثور على TTF أو OTF."
              exit 1
            fi

            FONT_PATH="$(cat selected_font.txt)"

            FONT_NAME="$(fc-scan \
              --format='%{family}' \
              "$FONT_PATH" | head -n 1)"

            if [ -z "$FONT_NAME" ]; then
              echo "❌ تعذر معرفة اسم الخط."
              exit 1
            fi

            mkdir -p "$HOME/.local/share/fonts"
            cp "$FONT_PATH" "$HOME/.local/share/fonts/"
            fc-cache -f "$HOME/.local/share/fonts"

            echo "FONT_NAME=$FONT_NAME" >> "$GITHUB_ENV"

            echo "✅ Font: $FONT_NAME"

          else
            echo "ℹ️ سيتم استخدام Noto Sans."
          fi

