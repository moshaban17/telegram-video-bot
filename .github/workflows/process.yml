            python download_watermark.py
          else
            echo "ℹ️ لا توجد علامة مائية مفعلة."
          fi

      # ============================================================
      # PREPARE WATERMARK
      # ============================================================

      - name: Prepare watermark
        run: |
          if [ -f "watermark_source" ]; then

            mkdir -p watermark_extract

            if file watermark_source | grep -qi "RAR"; then
              unrar x -o+ watermark_source watermark_extract/

              find watermark_extract -type f \
                \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) \
                | head -n 1 > watermark_file.txt

              if [ ! -s watermark_file.txt ]; then
                echo "❌ لم يتم العثور على صورة داخل RAR."
                exit 1
              fi

              cp "$(cat watermark_file.txt)" watermark.png
            else
              cp watermark_source watermark.png
            fi

            echo "✅ تم تجهيز العلامة المائية."

          else
            echo "ℹ️ لا توجد علامة مائية."
          fi

      # ============================================================
      # SETTINGS
      # ============================================================

      - name: Set processing settings
        env:
          FONT_SIZE: ${{ inputs.font_size }}
          FONT_COLOR: ${{ inputs.font_color }}
          SUBTITLE_OUTLINE: ${{ inputs.subtitle_outline }}
          SUBTITLE_BOX: ${{ inputs.subtitle_box }}
          WATERMARK_POSITION: ${{ inputs.watermark_position }}
          WATERMARK_SIZE: ${{ inputs.watermark_size }}
          WATERMARK_ENABLED: ${{ inputs.watermark_enabled }}
        run: |
          echo "FONT_SIZE=$FONT_SIZE" >> "$GITHUB_ENV"
          echo "FONT_COLOR=$FONT_COLOR" >> "$GITHUB_ENV"
          echo "SUBTITLE_OUTLINE=$SUBTITLE_OUTLINE" >> "$GITHUB_ENV"
          echo "SUBTITLE_BOX=$SUBTITLE_BOX" >> "$GITHUB_ENV"
          echo "WATERMARK_POSITION=$WATERMARK_POSITION" >> "$GITHUB_ENV"
          echo "WATERMARK_SIZE=$WATERMARK_SIZE" >> "$GITHUB_ENV"
          echo "WATERMARK_ENABLED=$WATERMARK_ENABLED" >> "$GITHUB_ENV"

      # ============================================================
      # RESOLUTION
      # ============================================================

      - name: Set resolution
        run: |
          case "${{ inputs.resolution }}" in
            same)
              echo "SCALE_FILTER=" >> "$GITHUB_ENV"
              ;;
            1080p)
              echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV"
              ;;
            720p)
              echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV"
              ;;
            480p)
              echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV"
              ;;
            360p)
              echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV"
              ;;
          esac

      # ============================================================
      # PROCESS VIDEO
      # ============================================================

      - name: Process video
        env:
          SUBTITLE_TYPE: ${{ inputs.subtitle_type }}
        run: |
          FILTERS=""

          if [ -f "subtitle.ass" ]; then
            echo "🎬 ASS detected - preserving original styles"
            FILTERS="subtitles=subtitle.ass"

          elif [ -f "subtitle.ssa" ]; then
            echo "🎬 SSA detected - preserving original styles"
            FILTERS="subtitles=subtitle.ssa"

          elif [ -f "subtitle.srt" ]; then
            echo "🎬 SRT detected"

            case "$FONT_COLOR" in
              white)  COLOR="&H00FFFFFF" ;;
              yellow) COLOR="&H0000FFFF" ;;
              cyan)   COLOR="&H00FFFF00" ;;
              green)  COLOR="&H0000FF00" ;;
              red)    COLOR="&H000000FF" ;;
              *)      COLOR="&H00FFFFFF" ;;
            esac

            FONT="${FONT_NAME:-Noto Sans}"

            if [ "$SUBTITLE_BOX" = "on" ]; then
              FORCE_STYLE="FontName=${FONT},FontSize=${FONT_SIZE},PrimaryColour=${COLOR},OutlineColour=&H00000000,Outline=0,Shadow=0,BorderStyle=3,BackColour=&H00000000,Alignment=2"
            else
              FORCE_STYLE="FontName=${FONT},FontSize=${FONT_SIZE},PrimaryColour=${COLOR},OutlineColour=&H00000000,Outline=${SUBTITLE_OUTLINE},Shadow=0,Alignment=2"
            fi

            FILTERS="subtitles=subtitle.srt:force_style='${FORCE_STYLE}'"
          fi

          if [ -n "$SCALE_FILTER" ]; then
            if [ -n "$FILTERS" ]; then
              FILTERS="${FILTERS},${SCALE_FILTER}"
            else
              FILTERS="${SCALE_FILTER}"
            fi
          fi

          # ----------------------------
          # No watermark
          # ----------------------------

          if [ "$WATERMARK_ENABLED" != "true" ] || [ ! -f "watermark.png" ]; then

            if [ -n "$FILTERS" ]; then

              ffmpeg -y \
                -i input.mkv \
                -vf "$FILTERS" \
                -map 0:v:0 \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4

            else

              echo "📦 No video filter required."

              ffmpeg -y \
                -i input.mkv \
                -map 0:v:0 \
                -map 0:a? \
                -c:v copy \
                -c:a copy \
                -movflags +faststart \
                output.mp4

            fi

          # ----------------------------
          # Watermark
          # ----------------------------

          else

            echo "🖼️ Adding watermark..."

            WM_SCALE="scale=iw*${WATERMARK_SIZE}/100:-1"

            case "$WATERMARK_POSITION" in
              top_left)
                WM_OVERLAY="20:20"
                ;;
              top_right)
                WM_OVERLAY="main_w-overlay_w-20:20"
                ;;
              bottom_left)
                WM_OVERLAY="20:main_h-overlay_h-20"
                ;;
              bottom_right)
                WM_OVERLAY="main_w-overlay_w-20:main_h-overlay_h-20"
                ;;
              *)
                WM_OVERLAY="20:20"
                ;;
            esac

            if [ -n "$FILTERS" ]; then

              ffmpeg -y \
                -i input.mkv \
                -i watermark.png \
                -filter_complex \
                "[0:v]${FILTERS}[v0];[1:v]${WM_SCALE}[wm];[v0][wm]overlay=${WM_OVERLAY}[v]" \
                -map "[v]" \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4

            else

              ffmpeg -y \
                -i input.mkv \
                -i watermark.png \
                -filter_complex \
                "[1:v]${WM_SCALE}[wm];[0:v][wm]overlay=${WM_OVERLAY}[v]" \
                -map "[v]" \
                -map 0:a? \
                -c:v libx264 \
                -preset veryfast \
                -crf 23 \
                -c:a copy \
                -movflags +faststart \
                output.mp4

            fi
          fi

          test -s output.mp4
          ls -lh output.mp4

      # ============================================================
      # SEND TO TELEGRAM
      # ============================================================

      - name: Send result to Telegram
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          cat > send.py <<'PY'
import os
import asyncio
from telethon import TelegramClient
from telethon.sessions import StringSession

async def main():
    client = TelegramClient(
        StringSession(os.environ["TG_SESSION"]),
        int(os.environ["API_ID"]),
        os.environ["API_HASH"]
    )

    await client.start()

    size = os.path.getsize("output.mp4")
    print(f"📦 Output size: {size / (1024**3):.2f} GB")

    await client.send_file(
        int(os.environ["CHAT_ID"]),
        "output.mp4",
        caption="🎬 تم تجهيز الفيلم بنجاح.",
        video=True,
        supports_streaming=True
    )

    await client.disconnect()

asyncio.run(main())
