name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: false
        type: string
        default: ""

      subtitle_url:
        description: "Direct subtitle URL"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "same"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      telegram_message_id:
        description: "Telegram video message ID"
        required: false
        type: string
        default: ""

      telegram_message_date:
        description: "Telegram video message date"
        required: false
        type: string
        default: ""

      subtitle_message_id:
        description: "Telegram subtitle message ID"
        required: false
        type: string
        default: ""

      subtitle_message_date:
        description: "Telegram subtitle message date"
        required: false
        type: string
        default: ""

      subtitle_type:
        description: "Subtitle type"
        required: false
        type: string
        default: "srt"

      font_message_id:
        description: "Telegram font message ID"
        required: false
        type: string
        default: ""

      font_message_date:
        description: "Telegram font message date"
        required: false
        type: string
        default: ""

      font_size:
        description: "Subtitle font size"
        required: false
        type: string
        default: "26"

      font_color:
        description: "Subtitle color"
        required: false
        type: string
        default: "white"

      subtitle_outline:
        description: "Subtitle outline"
        required: false
        type: string
        default: "0.5"

      subtitle_box:
        description: "Subtitle box"
        required: false
        type: string
        default: "off"

      watermark_message_id:
        description: "Telegram watermark message ID"
        required: false
        type: string
        default: ""

      watermark_message_date:
        description: "Telegram watermark message date"
        required: false
        type: string
        default: ""

      watermark_position:
        description: "Watermark position"
        required: false
        type: string
        default: "top_left"

      watermark_size:
        description: "Watermark size"
        required: false
        type: string
        default: "20"

      watermark_enabled:
        description: "Watermark enabled"
        required: false
        type: string
        default: "false"

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      - name: Install FFmpeg and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget fonts-noto-core file unrar
          python -m pip install --upgrade pip
          python -m pip install "telethon<2" cryptg

      # ============================================================
      # DOWNLOAD VIDEO
      # ============================================================

      - name: Download video
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_USERNAME: "@CinmalekHardsubBot"
          VIDEO_MESSAGE_DATE: ${{ inputs.telegram_message_date }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            echo "🔗 Downloading video from direct URL..."
            wget -O input.mkv "$VIDEO_URL"
          else
            echo "📱 Downloading video from Telegram..."

            cat > download_video.py <<'PY'
import os
import asyncio
from datetime import datetime, timezone
from telethon import TelegramClient
from telethon.sessions import StringSession

async def main():
    client = TelegramClient(
        StringSession(os.environ["TG_SESSION"]),
        int(os.environ["API_ID"]),
        os.environ["API_HASH"]
    )

    await client.start()

    bot = await client.get_entity(os.environ["BOT_USERNAME"])

    target_date = os.environ.get("VIDEO_MESSAGE_DATE", "").strip()

    if not target_date:
        raise RuntimeError("لم يتم إرسال تاريخ رسالة الفيديو.")

    target_dt = datetime.fromisoformat(target_date)

    if target_dt.tzinfo is None:
        target_dt = target_dt.replace(tzinfo=timezone.utc)

    recent = await client.get_messages(bot, limit=100)

    media_messages = [
        m for m in recent
        if m.media and m.date
    ]

    if not media_messages:
        raise RuntimeError("لم يتم العثور على أي Media في محادثة البوت.")

    message = min(
        media_messages,
        key=lambda m: abs((m.date - target_dt).total_seconds())
    )

    difference = abs(
        (message.date - target_dt).total_seconds()
    )

    print("🔎 Selected video message:", message.id)
    print("🔎 Message date:", message.date)
    print("🔎 Difference:", difference, "seconds")

    if difference > 120:
        raise RuntimeError(
            f"لم يتم العثور على رسالة الفيديو الصحيحة. "
            f"أقرب رسالة تبعد {difference:.1f} ثانية."
        )

    await client.download_media(
        message,
        file="input.mkv"
    )

    await client.disconnect()

asyncio.run(main())
PY

            python download_video.py
