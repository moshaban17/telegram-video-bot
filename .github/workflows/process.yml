name: Video Processor

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct video URL"
        required: false
        type: string
        default: ""

      subtitle_url:
        description: "Direct SRT URL"
        required: false
        type: string
        default: ""

      resolution:
        description: "Video resolution"
        required: true
        type: choice
        options:
          - "same"
          - "1080p"
          - "720p"
          - "480p"
          - "360p"
        default: "same"

      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      bot_username:
        description: "Telegram bot username"
        required: false
        type: string
        default: "CinmalekHardsubBot"

      srt_file_id:
        description: "Telegram SRT file ID"
        required: false
        type: string
        default: ""

      telegram_message_id:
        description: "Telegram video message ID"
        required: false
        type: string
        default: ""

      source_type:
        description: "Video source"
        required: false
        type: choice
        options:
          - "url"
          - "telegram"
        default: "url"

      operation:
        description: "Operation"
        required: false
        type: choice
        options:
          - "video"
          - "translate_srt"
          - "video_ocr"
          - "audio_srt"
        default: "video"

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SRT TRANSLATION
      # ============================================================

      - name: Install Python packages for SRT translation
        if: ${{ inputs.operation == 'translate_srt' }}
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Download SRT from Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SRT_FILE_ID: ${{ inputs.srt_file_id }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          file_id = os.environ["SRT_FILE_ID"]

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getFile",
              params={"file_id": file_id},
              timeout=30
          )

          r.raise_for_status()

          data = r.json()

          if not data.get("ok"):
              raise RuntimeError(data)

          file_path = data["result"]["file_path"]

          download_url = (
              f"https://api.telegram.org/file/bot"
              f"{token}/{file_path}"
          )

          r = requests.get(
              download_url,
              timeout=120
          )

          r.raise_for_status()

          with open("input.srt", "wb") as f:
              f.write(r.content)

          print("SRT downloaded successfully.")
          PY

      - name: Translate SRT with Gemini
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > translate_srt.py <<'PY'
          import os
          import re
          import time
          from google import genai

          INPUT_FILE = "input.srt"
          OUTPUT_FILE = "arabic.srt"

          MODEL = "gemini-3.8-flash"

          PROMPT = r"""
          أنت مترجم محترف لترجمة الأفلام والمسلسلات إلى العربية الفصحى.

          ترجم الحوار إلى عربية فصحى طبيعية وسينمائية.

          القواعد:

          1. افهم السياق قبل الترجمة.
          2. لا تترجم التعبيرات الاصطلاحية حرفيًا.
          3. راعِ جنس المتحدث والمخاطَب.
          4. حافظ على أسماء الشخصيات والمصطلحات.
          5. حافظ على مستوى الشتائم والإهانات في الأصل.
          6. لا تحذف أو تضيف حوارًا.
          7. لا تغير أرقام المقاطع.
          8. لا تغير التوقيتات.
          9. لا تغير ترتيب المقاطع.
          10. حافظ على جميع HTML tags كما هي.
          11. حافظ على رموز ♪ و ♫ كما هي.
          12. استخدم العربية الفصحى وليس العامية.
          13. استخدم "إله" حسب السياق بدل استبداله تلقائيًا بـ"الله".
          14. Hey man = يا رجل.
          15. Hey + name = يا [الاسم].
          16. Wow = يا للروعة.
          17. لا تضف شرحًا أو ملاحظات.
          18. أعد SRT فقط.

          غيّر نص الحوار فقط.
          """

          def parse_srt(text):
              text = text.replace("\r\n", "\n")
              text = text.replace("\r", "\n")

              blocks = re.split(
                  r"\n\s*\n",
                  text.strip()
              )

              result = []

              for block in blocks:
                  lines = block.split("\n")

                  if len(lines) < 3:
                      continue

                  result.append({
                      "number": lines[0],
                      "timing": lines[1],
                      "text": "\n".join(lines[2:])
                  })

              return result

          def build_srt(blocks):
              output = []

              for block in blocks:
                  output.append(block["number"])
                  output.append(block["timing"])
                  output.append(block["text"])
                  output.append("")

              return "\n".join(output)

          def extract_answer(text):
              text = text.strip()

              if text.startswith("```"):
                  lines = text.splitlines()

                  if lines:
                      lines = lines[1:]

                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]

                  text = "\n".join(lines)

              return text.strip()

          def translate_batch(client, batch):
              source = build_srt(batch)

              prompt = PROMPT + """

          هذه المقاطع:

          """ + source

              response = client.models.generate_content(
                  model=MODEL,
                  contents=prompt,
                  config={
                      "temperature": 0.2
                  }
              )

              translated = parse_srt(
                  extract_answer(response.text)
              )

              if len(translated) != len(batch):
                  raise RuntimeError(
                      f"Expected {len(batch)} subtitles "
                      f"but received {len(translated)}"
                  )

              for original, new in zip(
                  batch,
                  translated
              ):

                  if original["number"] != new["number"]:
                      raise RuntimeError(
                          "Subtitle numbering changed."
                      )

                  if original["timing"] != new["timing"]:
                      raise RuntimeError(
                          "Subtitle timing changed."
                      )

                  original["text"] = new["text"]

              return batch

          with open(
              INPUT_FILE,
              "r",
              encoding="utf-8-sig"
          ) as f:
              text = f.read()

          subtitles = parse_srt(text)

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          BATCH_SIZE = 80
          translated_all = []

          for start in range(
              0,
              len(subtitles),
              BATCH_SIZE
          ):

              end = min(
                  start + BATCH_SIZE,
                  len(subtitles)
              )

              print(
                  f"Translating subtitles "
                  f"{start + 1}-{end} "
                  f"of {len(subtitles)}"
              )

              translated_all.extend(
                  translate_batch(
                      client,
                      subtitles[start:end]
                  )
              )

              if end < len(subtitles):
                  time.sleep(2)

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  build_srt(translated_all)
              )

          print("Translation completed.")
          PY

          python translate_srt.py

      - name: Send translated SRT to Telegram
        if: ${{ inputs.operation == 'translate_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@arabic.srt" \
            -F "caption=🇸🇦 تمت ترجمة ملف SRT إلى العربية الفصحى بنجاح."

      # ============================================================
      # TELEGRAM / VIDEO TOOLS
      # ============================================================

      - name: Install Telegram library
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt' }}
        run: |
          python -m pip install "telethon<2" cryptg

      - name: Install audio transcription tools
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2
          python -m pip install --upgrade pip
          pip install faster-whisper

      - name: Install video tools
        if: ${{ inputs.operation == 'video' || inputs.operation == 'video_ocr' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      # ============================================================
      # TELEGRAM MEDIA INPUT
      # ============================================================

      - name: Download media from Telegram
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'video_ocr' || inputs.operation == 'audio_srt') && inputs.source_type == 'telegram' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          BOT_USERNAME: ${{ inputs.bot_username }}
          OPERATION: ${{ inputs.operation }}
        run: |

          cat > download_telegram.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          VIDEO_EXTENSIONS = (
              ".mp4",
              ".mkv",
              ".avi",
              ".mov",
              ".webm",
              ".m4v",
              ".ts"
          )

          AUDIO_EXTENSIONS = (
              ".mp3",
              ".wav",
              ".m4a",
              ".aac",
              ".ogg",
              ".opus",
              ".flac",
              ".amr",
              ".wma"
          )


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(os.environ["API_ID"]),
                  os.environ["API_HASH"]
              )

              await client.start()

              user_id = int(
                  os.environ["CHAT_ID"]
              )

              me = await client.get_me()

              if me.id != user_id:
                  raise RuntimeError(
                      "Telegram session account does not match CHAT_ID."
                  )

              bot_username = (
                  os.environ["BOT_USERNAME"]
                  .strip()
                  .lstrip("@")
              )

              operation = os.environ[
                  "OPERATION"
              ]

              entity = await client.get_entity(
                  f"@{bot_username}"
              )

              print(
                  "🔎 Searching last 200 messages..."
              )

              found = None

              async for item in client.iter_messages(
                  entity,
                  limit=200,
                  from_user=user_id
              ):

                  if not item.media:
                      continue

                  if not item.file:
                      continue

                  mime = (
                      getattr(
                          item.file,
                          "mime_type",
                          ""
                      )
                      or ""
                  )

                  name = (
                      getattr(
                          item.file,
                          "name",
                          ""
                      )
                      or ""
                  ).lower()

                  is_video = (
                      mime.startswith("video/")
                      or name.endswith(
                          VIDEO_EXTENSIONS
                      )
                  )

                  is_audio = (
                      mime.startswith("audio/")
                      or name.endswith(
                          AUDIO_EXTENSIONS
                      )
                  )

                  if operation == "audio_srt":

                      if not (
                          is_video or is_audio
                      ):
                          continue

                  else:

                      if not is_video:
                          continue

                  found = item
                  break

              if not found:
                  raise RuntimeError(
                      "No suitable media found."
                  )

              print(
                  f"✅ Found Telegram message "
                  f"{found.id}"
              )

              path = await found.download_media(
                  file="input.mkv"
              )

              if not path:
                  raise RuntimeError(
                      "Telegram download failed."
                  )

              print(
                  f"✅ Downloaded: {path}"
              )

              print(
                  f"📦 Size: "
                  f"{os.path.getsize(path) / 1024 / 1024:.2f} MB"
              )

              await client.disconnect()


          asyncio.run(main())
          PY

          python download_telegram.py

      # ============================================================
      # URL DOWNLOAD
      # ============================================================

      - name: Download video from URL
        if: ${{ (inputs.operation == 'video' || inputs.operation == 'video_ocr') && inputs.source_type == 'url' }}
        run: |

          if [ -z "${{ inputs.video_url }}" ]; then
            echo "❌ video_url is empty."
            exit 1
          fi

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --continue=true \
            --summary-interval=5 \
            --console-log-level=notice \
            -o input.mkv \
            "${{ inputs.video_url }}"

      - name: Download media from URL for speech to SRT
        if: ${{ inputs.operation == 'audio_srt' && inputs.source_type == 'url' }}
        run: |

          if [ -z "${{ inputs.video_url }}" ]; then
            echo "❌ video_url is empty."
            exit 1
          fi

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --continue=true \
            --summary-interval=5 \
            --console-log-level=notice \
            -o input.mkv \
            "${{ inputs.video_url }}"

      # ============================================================
      # SPEECH TO SRT
      # ============================================================

      - name: Extract audio for speech recognition
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          ffmpeg -y \
            -i input.mkv \
            -vn \
            -ac 1 \
            -ar 16000 \
            -c:a pcm_s16le \
            speech.wav

      - name: Convert speech to SRT
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          cat > speech_to_srt.py <<'PY'
          import re

          from faster_whisper import WhisperModel


          INPUT_FILE = "speech.wav"
          OUTPUT_FILE = "speech.srt"

          MODEL_NAME = "medium"


          def format_time(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              minutes = (
                  total_ms % 3600000
              ) // 60000

              secs = (
                  total_ms % 60000
              ) // 1000

              milliseconds = (
                  total_ms % 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{milliseconds:03d}"
              )


          def clean_text(text):

              text = text.strip()

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text


          print("========================================")
          print("🎙️ SPEECH TO SRT")
          print("========================================")
          print("🧠 Loading Whisper model...")
          print(f"📦 Model: {MODEL_NAME}")
          print("⚙️ Device: CPU")
          print("⚙️ Compute type: int8")

          model = WhisperModel(
              MODEL_NAME,
              device="cpu",
              compute_type="int8",
              cpu_threads=4,
              num_workers=1
          )

          print("✅ Whisper model loaded.")
          print("🎧 Transcribing speech...")
          print("🔇 VAD enabled.")


          segments, info = model.transcribe(

              INPUT_FILE,

              beam_size=3,

              temperature=0,

              vad_filter=True,

              vad_parameters={
                  "min_silence_duration_ms": 500,
                  "speech_pad_ms": 400,
                  "min_speech_duration_ms": 150
              },

              condition_on_previous_text=True,

              no_speech_threshold=0.92,

              log_prob_threshold=-2.5,

              compression_ratio_threshold=3.5
          )


          print(
              f"🌐 Detected language: "
              f"{getattr(info, 'language', 'unknown')}"
          )

          print(
              f"📊 Language probability: "
              f"{getattr(info, 'language_probability', 0):.3f}"
          )


          results = []

          last_text = ""
          last_end = 0.0


          for segment in segments:

              text = clean_text(
                  segment.text
              )

              if not text:
                  continue

              no_speech_prob = getattr(
                  segment,
                  "no_speech_prob",
                  0.0
              )

              if no_speech_prob > 0.97:
                  continue

              start = segment.start
              end = segment.end

              duration = end - start

              # ------------------------------------------------
              # HARD PROTECTION AGAINST WHISPER HALLUCINATIONS
              # ------------------------------------------------

              if duration > 30:

                  print(
                      "⚠️ Skipping suspicious "
                      f"long segment: "
                      f"{format_time(start)} --> "
                      f"{format_time(end)}"
                  )

                  continue


              normalized = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip().lower()


              previous_normalized = re.sub(
                  r"\s+",
                  " ",
                  last_text
              ).strip().lower()


              # Exact repeated text
              if (
                  normalized
                  and normalized == previous_normalized
              ):

                  print(
                      f"⚠️ Repeated text removed: "
                      f"{text}"
                  )

                  # Do NOT extend the subtitle indefinitely.
                  continue


              # ------------------------------------------------
              # Detect repeated same text among recent entries
              # ------------------------------------------------

              recent_repeat = False

              for previous in results[-6:]:

                  previous_text = re.sub(
                      r"\s+",
                      " ",
                      previous["text"]
                  ).strip().lower()

                  if normalized == previous_text:

                      gap = (
                          start
                          - previous["end"]
                      )

                      if gap < 8:

                          recent_repeat = True

                          print(
                              "⚠️ Recent repeated "
                              f"text removed: {text}"
                          )

                          break

              if recent_repeat:
                  continue


              # ------------------------------------------------
              # Protect against extremely long subtitle entries
              # ------------------------------------------------

              if duration > 20:

                  print(
                      "⚠️ Long subtitle removed: "
                      f"{duration:.1f}s | {text}"
                  )

                  continue


              results.append({
                  "start": start,
                  "end": end,
                  "text": text
              })


              last_text = text
              last_end = end


              print(
                  f"[{format_time(start)} --> "
                  f"{format_time(end)}] "
                  f"{text}"
              )


          # ----------------------------------------------------
          # Final cleanup
          # ----------------------------------------------------

          cleaned_results = []

          for item in results:

              text = item["text"].strip()

              if not text:
                  continue

              normalized = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip().lower()


              duplicate = False

              for previous in cleaned_results[-5:]:

                  previous_normalized = re.sub(
                      r"\s+",
                      " ",
                      previous["text"]
                  ).strip().lower()

                  if normalized == previous_normalized:

                      if (
                          item["start"]
                          - previous["end"]
                          < 8
                      ):

                          duplicate = True
                          break


              if duplicate:
                  continue


              cleaned_results.append(item)


          results = cleaned_results


          # ----------------------------------------------------
          # Write SRT
          # ----------------------------------------------------

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              for number, item in enumerate(
                  results,
                  start=1
              ):

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{format_time(item['start'])} --> "
                      f"{format_time(item['end'])}\n"
                  )

                  f.write(
                      item["text"]
                  )

                  f.write(
                      "\n\n"
                  )


          print("========================================")
          print(
              f"✅ SRT created: "
              f"{len(results)} subtitle entries"
          )
          print(
              f"📄 Output file: {OUTPUT_FILE}"
          )
          print("========================================")
          PY

          python speech_to_srt.py

      - name: Send speech SRT to Telegram
        if: ${{ inputs.operation == 'audio_srt' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@speech.srt" \
            -F "caption=🎙️ تم استخراج الكلام المنطوق فقط إلى SRT."

      # ============================================================
      # OCR
      # ============================================================

      - name: Install OCR packages
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-sin \
            tesseract-ocr-hin \
            tesseract-ocr-mal \
            tesseract-ocr-tel \
            tesseract-ocr-tam \
            tesseract-ocr-ben

          python -m pip install --upgrade pip

          pip install \
            opencv-python-headless \
            pytesseract

      - name: Extract screen text with OCR
        if: ${{ inputs.operation == 'video_ocr' }}
        run: |

          cat > video_ocr.py <<'PY'
          import cv2
          import pytesseract
          import re

          VIDEO_FILE = "input.mkv"
          OUTPUT_FILE = "screen_text.srt"

          SAMPLE_SECONDS = 1.0

          OCR_LANGUAGES = (
              "eng+sin+hin+mal+tel+tam+ben"
          )

          cap = cv2.VideoCapture(
              VIDEO_FILE
          )

          if not cap.isOpened():
              raise RuntimeError(
                  "Cannot open video."
              )

          fps = cap.get(
              cv2.CAP_PROP_FPS
          )

          if not fps or fps <= 0:
              fps = 25

          total_frames = int(
              cap.get(
                  cv2.CAP_PROP_FRAME_COUNT
              )
          )

          duration = (
              total_frames / fps
              if total_frames > 0
              else 0
          )

          results = []

          last_text = ""
          start_time = None
          last_time = None


          def normalize(text):

              text = text.replace(
                  "\n",
                  " "
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()


          def format_time(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              minutes = (
                  total_ms % 3600000
              ) // 60000

              secs = (
                  total_ms % 60000
              ) // 1000

              milliseconds = (
                  total_ms % 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{milliseconds:03d}"
              )


          def add_result(
              text,
              start,
              end
          ):

              if not text:
                  return

              if start is None:
                  return

              if end <= start:
                  return

              results.append({
                  "text": text,
                  "start": start,
                  "end": end
              })


          frame_index = 0
          next_sample = 0.0

          while True:

              ret, frame = cap.read()

              if not ret:
                  break

              current_time = (
                  frame_index / fps
              )

              if current_time + 0.001 < next_sample:

                  frame_index += 1
                  continue

              next_sample += SAMPLE_SECONDS

              height, width = frame.shape[:2]

              crop_start = int(
                  height * 0.45
              )

              cropped = frame[
                  crop_start:height,
                  0:width
              ]

              cropped = cv2.resize(
                  cropped,
                  None,
                  fx=1.5,
                  fy=1.5,
                  interpolation=cv2.INTER_CUBIC
              )

              try:

                  text = pytesseract.image_to_string(
                      cropped,
                      lang=OCR_LANGUAGES,
                      config="--psm 6"
                  )

              except Exception:
                  frame_index += 1
                  continue

              current_text = normalize(
                  text
              )

              if len(current_text) > 300:
                  current_text = ""

              if current_text == last_text:

                  last_time = current_time

              else:

                  if last_text:

                      add_result(
                          last_text,
                          start_time,
                          last_time + SAMPLE_SECONDS
                      )

                  if current_text:

                      start_time = current_time
                      last_time = current_time

                  else:

                      start_time = None
                      last_time = None

                  last_text = current_text

              frame_index += 1

          cap.release()

          if (
              last_text
              and start_time is not None
          ):

              add_result(
                  last_text,
                  start_time,
                  last_time + SAMPLE_SECONDS
              )


          cleaned = []

          for item in results:

              text = item["text"].strip()

              if len(text) < 2:
                  continue

              if cleaned:

                  previous = cleaned[-1]

                  if (
                      previous["text"] == text
                      and item["start"]
                      <= previous["end"] + 1.5
                  ):

                      previous["end"] = item["end"]
                      continue

              cleaned.append(item)


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              for number, item in enumerate(
                  cleaned,
                  start=1
              ):

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{format_time(item['start'])} --> "
                      f"{format_time(item['end'])}\n"
                  )

                  f.write(
                      item["text"]
                  )

                  f.write(
                      "\n\n"
                  )


          print(
              f"✅ OCR SRT created: "
              f"{len(cleaned)} entries"
          )
          PY

          python video_ocr.py

      - name: Send OCR SRT to Telegram
        if: ${{ inputs.operation == 'video_ocr' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |

          curl -sS \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@screen_text.srt" \
            -F "caption=👁️ تم استخراج الكلام الظاهر على الشاشة إلى SRT."

      # ============================================================
      # VIDEO PROCESSING
      # ============================================================

      - name: Install FFmpeg fonts
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |
          sudo apt-get install -y fonts-noto-core

      - name: Download subtitle
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          aria2c \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=1M \
            --file-allocation=none \
            -o subtitle.srt \
            "${{ inputs.subtitle_url }}"

      - name: Set resolution
        if: ${{ inputs.operation == 'video' && inputs.resolution != 'same' }}
        run: |

          case "${{ inputs.resolution }}" in

            "1080p")
              echo "SCALE_FILTER=scale=-2:1080" >> "$GITHUB_ENV"
              ;;

            "720p")
              echo "SCALE_FILTER=scale=-2:720" >> "$GITHUB_ENV"
              ;;

            "480p")
              echo "SCALE_FILTER=scale=-2:480" >> "$GITHUB_ENV"
              ;;

            "360p")
              echo "SCALE_FILTER=scale=-2:360" >> "$GITHUB_ENV"
              ;;

          esac

      - name: Process video with subtitle
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url != '' }}
        run: |

          if [ "${SCALE_FILTER:-}" = "" ]; then

            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2'"

          else

            VIDEO_FILTER="subtitles=subtitle.srt:force_style='FontName=Noto Sans,FontSize=28,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=1,Shadow=0,Alignment=2',${SCALE_FILTER}"

          fi

          ffmpeg -y \
            -i input.mkv \
            -vf "$VIDEO_FILTER" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Convert resolution
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url == '' && inputs.resolution != 'same' }}
        run: |

          ffmpeg -y \
            -i input.mkv \
            -vf "${SCALE_FILTER}" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a copy \
            -movflags +faststart \
            output.mp4

      - name: Keep original video
        if: ${{ inputs.operation == 'video' && inputs.resolution == 'same' && inputs.subtitle_url == '' }}
        run: |

          cp input.mkv output.mkv

      - name: Select output
        if: ${{ inputs.operation == 'video' }}
        run: |

          if [ "${{ inputs.resolution }}" = "same" ] && [ "${{ inputs.subtitle_url }}" = "" ]; then

            echo "OUTPUT_FILE=output.mkv" >> "$GITHUB_ENV"

          else

            echo "OUTPUT_FILE=output.mp4" >> "$GITHUB_ENV"

          fi

      # ============================================================
      # SEND VIDEO
      # ============================================================

      - name: Send video result to Telegram
        if: ${{ inputs.operation == 'video' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |

          cat > send.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(
                      os.environ["API_ID"]
                  ),
                  os.environ["API_HASH"]
              )

              await client.start()

              print(
                  "📤 Starting Telegram upload..."
              )

              await client.send_file(
                  int(
                      os.environ["CHAT_ID"]
                  ),
                  os.environ["OUTPUT_FILE"],
                  caption="🎬 تم تجهيز الفيلم بنجاح.",
                  video=True,
                  supports_streaming=True
              )

              print(
                  "✅ Telegram upload completed."
              )

              await client.disconnect()


          asyncio.run(main())
          PY

          python send.py

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean files
        if: always()
        run: |

          rm -f input.mkv
          rm -f output.mkv
          rm -f output.mp4
          rm -f subtitle.srt
          rm -f input.srt
          rm -f arabic.srt
          rm -f screen_text.srt
          rm -f speech.wav
          rm -f speech.srt
          rm -f send.py
          rm -f download_telegram.py
          rm -f translate_srt.py
          rm -f video_ocr.py
          rm -f speech_to_srt.py
