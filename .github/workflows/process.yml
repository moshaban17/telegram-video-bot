            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output.mp4


      # ============================================================
      # RESOLUTION CONVERSION WITHOUT SUBTITLE
      # ============================================================

      - name: Convert resolution
        if: ${{ inputs.operation == 'video' && inputs.subtitle_url == '' && inputs.srt_file_id == '' && inputs.resolution != 'same' }}
        run: |

          ffmpeg -y \
            -i input.mkv \
            -vf "${SCALE_FILTER}" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output.mp4


      # ============================================================
      # SAME RESOLUTION WITHOUT SUBTITLE
      # ============================================================

      - name: Remux original video to MP4
        if: ${{ inputs.operation == 'video' && inputs.resolution == 'same' && inputs.subtitle_url == '' && inputs.srt_file_id == '' }}
        run: |

          echo "🎬 Keeping original resolution and quality."


          if ffmpeg -y \
            -i input.mkv \
            -map 0:v:0 \
            -map 0:a? \
            -c copy \
            -movflags +faststart \
            output.mp4; then

            echo "✅ Original video successfully remuxed to MP4."

          else

            echo "⚠️ Direct remux failed."
            echo "🔄 Re-encoding to H.264/AAC."

            rm -f output.mp4

            ffmpeg -y \
              -i input.mkv \
              -map 0:v:0 \
              -map 0:a? \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -c:a aac \
              -b:a 192k \
              -movflags +faststart \
              output.mp4

          fi


      # ============================================================
      # SELECT OUTPUT
      # ============================================================

      - name: Select output
        if: ${{ inputs.operation == 'video' || inputs.operation == 'subtitle' }}
        run: |

          if [ -f output.mp4 ]; then

            echo "OUTPUT_FILE=output.mp4" >> "$GITHUB_ENV"

          else

            echo "❌ output.mp4 was not created."

            exit 1

          fi


      # ============================================================
      # CHECK OUTPUT
      # ============================================================

      - name: Check final video
        if: ${{ inputs.operation == 'video' || inputs.operation == 'subtitle' }}
        run: |

          if [ ! -f "${OUTPUT_FILE}" ]; then

            echo "❌ Output file not found."

            exit 1

          fi


          echo "========================================"

          echo "🎬 Final output:"
          echo "${OUTPUT_FILE}"

          echo "📦 Size:"

          du -h "${OUTPUT_FILE}"

          echo "========================================"


          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,codec_type \
            -of default=noprint_wrappers=1 \
            "${OUTPUT_FILE}"


      # ============================================================
      # SEND VIDEO
      # ============================================================

      - name: Send video result to Telegram
        if: ${{ inputs.operation == 'video' || inputs.operation == 'subtitle' }}
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          CHAT_ID: ${{ inputs.chat_id }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          OPERATION: ${{ inputs.operation }}
        run: |

          cat > send.py <<'PY'
          import os
          import asyncio

          from telethon import TelegramClient
          from telethon.sessions import StringSession


          async def main():

              client = TelegramClient(
                  StringSession(
                      os.environ["TG_SESSION"]
                  ),
                  int(
                      os.environ["API_ID"]
                  ),
                  os.environ["API_HASH"]
              )


              await client.start()


              output_file = os.environ[
                  "OUTPUT_FILE"
              ]


              operation = os.environ.get(
                  "OPERATION",
                  "video"
              )


              if not os.path.exists(
                  output_file
              ):

                  raise RuntimeError(
                      "Output video does not exist."
                  )


              size_mb = (
                  os.path.getsize(
                      output_file
                  )
                  / 1024
                  / 1024
              )


              print(
                  "📤 Starting Telegram upload..."
              )

              print(
                  f"📦 File size: "
                  f"{size_mb:.2f} MB"
              )


              if operation == "subtitle":

                  caption = (
                      "📝 تم حرق الترجمة "
                      "وتجهيز الفيلم بنجاح."
                  )

              else:

                  caption = (
                      "🎬 تم تجهيز الفيلم بنجاح."
                  )


              await client.send_file(
                  int(
                      os.environ["CHAT_ID"]
                  ),
                  output_file,
                  caption=caption,
                  video=True,
                  supports_streaming=True
              )


              print(
                  "✅ Telegram upload completed."
              )


              await client.disconnect()


          asyncio.run(main())
          PY


          python send.py


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean files
        if: always()
        run: |

          rm -f input.mkv
          rm -f output.mkv
          rm -f output.mp4

          rm -f subtitle.srt
          rm -f subtitle.ass
          rm -f subtitle_style.txt

          rm -f input.srt
          rm -f arabic.srt

          rm -f screen_text.srt

          rm -f speech.wav
          rm -f speech.srt

          rm -f send.py
          rm -f download_telegram.py
          rm -f translate_srt.py
          rm -f video_ocr.py
          rm -f speech_to_srt.py

          echo "🧹 Cleanup completed."
