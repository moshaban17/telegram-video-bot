      - name: Convert speech to SRT
        if: ${{ inputs.operation == 'audio_srt' }}
        run: |

          cat > speech_to_srt.py <<'PY'
          import re

          from faster_whisper import WhisperModel


          INPUT_FILE = "speech.wav"
          OUTPUT_FILE = "speech.srt"

          MODEL_NAME = "medium"


          def format_time(seconds):

              total_ms = int(
                  round(seconds * 1000)
              )

              hours = total_ms // 3600000

              minutes = (
                  total_ms % 3600000
              ) // 60000

              secs = (
                  total_ms % 60000
              ) // 1000

              milliseconds = (
                  total_ms % 1000
              )

              return (
                  f"{hours:02d}:"
                  f"{minutes:02d}:"
                  f"{secs:02d},"
                  f"{milliseconds:03d}"
              )


          def clean_text(text):

              text = text.strip()

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text


          def normalize_text(text):

              return clean_text(
                  text
              ).lower()


          print("========================================")
          print("🎙️ SPEECH TO SRT")
          print("========================================")
          print("🧠 Loading Whisper model...")
          print(f"📦 Model: {MODEL_NAME}")
          print("⚙️ Device: CPU")
          print("⚙️ Compute type: int8")


          model = WhisperModel(
              MODEL_NAME,
              device="cpu",
              compute_type="int8",
              cpu_threads=4,
              num_workers=1
          )


          print("✅ Whisper model loaded.")
          print("🎧 Transcribing speech...")
          print("🔇 VAD enabled.")


          segments, info = model.transcribe(

              INPUT_FILE,

              beam_size=3,

              temperature=0,

              vad_filter=True,

              vad_parameters={
                  "min_silence_duration_ms": 500,
                  "speech_pad_ms": 400,
                  "min_speech_duration_ms": 150
              },

              condition_on_previous_text=False,

              no_speech_threshold=0.92,

              log_prob_threshold=-2.5,

              compression_ratio_threshold=3.5
          )


          print(
              f"🌐 Detected language: "
              f"{getattr(info, 'language', 'unknown')}"
          )


          print(
              f"📊 Language probability: "
              f"{getattr(info, 'language_probability', 0):.3f}"
          )


          results = []


          for segment in segments:

              text = clean_text(
                  segment.text
              )

              if not text:
                  continue

              start = float(
                  segment.start
              )

              end = float(
                  segment.end
              )

              duration = end - start

              no_speech_prob = float(
                  getattr(
                      segment,
                      "no_speech_prob",
                      0.0
                  )
              )

              avg_logprob = float(
                  getattr(
                      segment,
                      "avg_logprob",
                      0.0
                  )
              )

              compression_ratio = float(
                  getattr(
                      segment,
                      "compression_ratio",
                      0.0
                  )
              )

              if no_speech_prob > 0.97:
                  print(
                      "⚠️ Skipping no-speech:"
                      f" {text}"
                  )
                  continue

              if duration > 30:
                  print(
                      "⚠️ Skipping very long:"
                      f" {duration:.1f}s | {text}"
                  )
                  continue

              if duration > 20:
                  print(
                      "⚠️ Skipping long subtitle:"
                      f" {duration:.1f}s | {text}"
                  )
                  continue

              normalized = normalize_text(
                  text
              )

              if (
                  avg_logprob < -2.5
                  and compression_ratio > 2.8
              ):
                  print(
                      "⚠️ Skipping low-confidence "
                      f"hallucination: {text}"
                  )
                  continue

              duplicate = False

              for previous in results[-8:]:

                  previous_normalized = (
                      normalize_text(
                          previous["text"]
                      )
                  )

                  if (
                      normalized
                      != previous_normalized
                  ):
                      continue

                  gap = (
                      start
                      - previous["end"]
                  )

                  if gap < 10:
                      duplicate = True

                      print(
                          "⚠️ Repeated text removed:"
                          f" {text}"
                      )

                      break

              if duplicate:
                  continue

              words = normalized.split()

              if len(words) >= 5:

                  unique_words = set(
                      words
                  )

                  repetition_ratio = (
                      len(unique_words)
                      / len(words)
                  )

                  if repetition_ratio < 0.34:

                      print(
                          "⚠️ Repeated-word "
                          "hallucination removed:"
                          f" {text}"
                      )

                      continue

              results.append({
                  "start": start,
                  "end": end,
                  "text": text
              })

              print(
                  f"[{format_time(start)} --> "
                  f"{format_time(end)}] "
                  f"{text}"
              )


          cleaned_results = []

          for item in results:

              text = item["text"].strip()

              if not text:
                  continue

              normalized = normalize_text(
                  text
              )

              duplicate = False

              for previous in cleaned_results[-8:]:

                  previous_normalized = (
                      normalize_text(
                          previous["text"]
                      )
                  )

                  if (
                      normalized
                      != previous_normalized
                  ):
                      continue

                  gap = (
                      item["start"]
                      - previous["end"]
                  )

                  if gap < 10:
                      duplicate = True
                      break

              if duplicate:
                  continue

              cleaned_results.append(
                  item
              )


          results = cleaned_results


          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              for number, item in enumerate(
                  results,
                  start=1
              ):

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{format_time(item['start'])} --> "
                      f"{format_time(item['end'])}\n"
                  )

                  f.write(
                      item["text"]
                  )

                  f.write(
                      "\n\n"
                  )


          print("========================================")

          print(
              f"✅ SRT created: "
              f"{len(results)} subtitle entries"
          )

          print(
              f"📄 Output file: {OUTPUT_FILE}"
          )

          print("========================================")
          PY

